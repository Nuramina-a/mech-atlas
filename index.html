</style></head><body><a class="skip" href="#main" data-scroll="main">跳到正文</a><aside class="sidebar" id="sidebar" aria-label="学习目录"></aside><div class="backdrop" id="backdrop"></div><div class="workspace"><header class="topbar"><div class="button-row"><button class="menu-toggle" id="menuToggle" aria-label="打开学习目录">☰</button><span class="top-title" id="topTitle">机械与机器人 / 学习实验室</span></div><div class="top-actions"><button data-action="search" aria-label="搜索知识">⌕ 搜索</button><button data-action="font" title="切换正文大小">Aa</button><button data-action="theme" title="切换日间与夜读">◐</button><button data-action="focus" class="focus-button">专注阅读</button></div></header><main id="main" tabindex="-1"><div class="loading">正在打开机理学习实验室…</div></main><footer class="page-footer"><span>机理 MECH ATLAS · 理解原理，也理解条件。</span><span>原创教学图解与假设算例 · 原厂 / 教材来源逐课标注 · 2026.11</span></footer></div><dialog class="search-dialog" id="searchDialog" aria-labelledby="searchLabel"><div class="search-head"><label class="sr-only" id="searchLabel" for="searchInput">搜索知识、工艺或问题</label><span>⌕</span><input id="searchInput" placeholder="试试：材料、步进、FOC、缩痕、轴承…" autocomplete="off"><button data-action="close-search" class="ghost" aria-label="关闭搜索">✕</button></div><div class="search-results" id="searchResults"></div><div class="search-tip">搜索覆盖课程正文与案例 · Esc 关闭 · / 快速搜索</div></dialog><dialog id="figureDialog" class="figure-dialog" aria-labelledby="figureDialogTitle"><div class="figure-dialog-head"><strong id="figureDialogTitle">图解放大</strong><button data-action="close-figure" aria-label="关闭放大图解">✕ 关闭</button></div><div class="zoom-canvas" id="zoomCanvas"></div><p>当前图解的静态快照 · 小屏幕可横向滚动 · 关闭后继续调节参数</p></dialog><div id="toast" class="toast hidden" role="status"></div><input type="file" id="importFile" accept="application/json,.json" hidden><noscript><p>本学习站需要启用 JavaScript 才能显示课程与交互实验。</p></noscript><script>window.DATA={"modules":[{"id":"start","no":"01","title":"工程起点","desc":"从需求到可验证的设计","icon":"compass","color":"#0b7d77"},{"id":"materials","no":"02","title":"材料与表面","desc":"为什么这个零件用这种材料","icon":"material","color":"#ab6b2c"},{"id":"mechanics","no":"03","title":"受力与结构","desc":"看懂力怎样穿过一个零件","icon":"beam","color":"#476cbe"},{"id":"mechanisms","no":"04","title":"机构与传动","desc":"把运动送到需要它的地方","icon":"gear","color":"#98654c"},{"id":"components","no":"05","title":"机械零部件","desc":"轴承、螺栓和连接的真实工作","icon":"bearing","color":"#5b7a61"},{"id":"motors","no":"06","title":"电机与执行器","desc":"从电流到转矩与位移","icon":"motor","color":"#c47435"},{"id":"control","no":"07","title":"控制与感知","desc":"让机构按目标运动","icon":"control","color":"#7157a6"},{"id":"precision","no":"08","title":"公差与测量","desc":"让每一批零件都能装起来","icon":"fit","color":"#377d94"},{"id":"manufacturing","no":"09","title":"制造与工艺","desc":"让图纸在车间里成立","icon":"cnc","color":"#9b6650"},{"id":"integration","no":"10","title":"机器人集成","desc":"热、线束、地面和空间接口","icon":"robot","color":"#327b71"},{"id":"validation","no":"11","title":"仿真与验证","desc":"用证据判断设计是否可靠","icon":"vibration","color":"#6177a7"},{"id":"delivery","no":"12","title":"工程交付","desc":"把一次样机变成可重复成果","icon":"drawing","color":"#997140"}],"lessons":[{"id":"requirements","module":"start","title":"需求：把“好用”变成能检验的条件","goal":"拿到“做一个机器人支架”，先知道要问什么。","core":[{"title":"先描述功能，再约束解法","text":"载荷不是只有重量。列出安装对象、质量和重心、运动轨迹、加速度、碰撞工况、允许位移、环境、寿命、加工数量、成本和维修方式。需求应包含数值、条件与验收方法，未知项先标成假设，不偷偷填成事实。"},{"title":"功能—接口—指标","text":"“固定相机”是功能；孔位、外形、供电连接器和视场是接口；满载挠度、角度重复性和装配时间是指标。一个结构既要承担载荷，也可能是定位链、散热通道和线缆通道。"},{"title":"比较方案，而非第一眼就建模","text":"把 CNC 支架、折弯支架和打印支架放在相同工况下比较。先用估算淘汰不满足刚度或温度的方案，再比较成本、交期与维护。新方案的优势要用同一验收指标证明。"}],"formula":"验收条件 = 工况 + 测量对象 + 阈值 + 测量方法。","example":"教学任务：载重 1 kg、悬臂 100 mm 的相机支架。先约定静载挠度 ≤0.2 mm、相机视场无遮挡、连接器可拔插、加工数量 5 件；跌落和振动要求仍需另外给出。此时才有选择材料与截面的依据。","pitfalls":["“高精度”“轻量化”没有基准时无法验收。","先有现成电机也可以设计，但必须记录其能力边界，再验证是否满足需求。"],"practice":"拿起台灯或手机支架，写下 3 项功能、3 个接口、3 项可测指标。不要拆电器，只观察调节和锁紧动作。","quiz":{"q":"哪条需求最容易验证？","options":["结构要结实","指定载荷下末端位移不超过 0.2 mm，并用百分表测量","材料必须高端"],"answer":1,"why":"可测指标需要同时说明载荷条件与测量方式。"},"links":["loads","dfma","test-plan"],"sources":["R1","R2"],"visual":"flow","level":"基础","table":null},{"id":"units","module":"start","title":"单位与数量级：先让公式说同一种语言","goal":"避免 kg、N、mm、m、rpm 混算。","core":[{"title":"质量、力、功率各说什么","text":"质量表示惯性，重力约为 mg；转矩是力与垂直力臂的乘积，能量可用力沿位移的积分计算。N·m 和 J 的量纲相同，但转矩与能量物理意义不同。功率是做功速率，不能由静态保持转矩单独推断。"},{"title":"两套常用一致单位","text":"结构手算常用 N、mm、MPa，因为 1 MPa=1 N/mm²。动力学常用 kg、m、s、N、N·m。不要把毫米的三次方混进以米为单位的 E·I。角速度用于功率时要换成 rad/s。"},{"title":"数量级是一道独立检查","text":"先用粗略估算判断：1 kg 在 0.1 m 力臂上的重力矩约 1 N·m。若计算得到 1000 N·m，应优先检查单位，而非立即买大电机。区分绝对误差、相对误差和有效数字。"}],"formula":"1 N·m = 1000 N·mm；ω = 2πn/60；P = Tω；1 MPa = 1 N/mm²。","example":"一个轴在 120 r/min 时输出 2 N·m，机械功率约 2×2π×120/60=25.1 W。若总效率为 0.7，输入功率约 35.9 W；真实电气输入还需按系统边界检查。","pitfalls":["铭牌“100 W”不代表任意转速下都有足够转矩。","用 9.81 而不是 10 不会自动让其余错误假设变精确。"],"practice":"用纸笔把 0.5 N·m、60 r/min、200 MPa 分别换成 N·mm、rad/s、N/mm²。","quiz":{"q":"1 N·m 等于多少 N·mm？","options":["1","100","1000"],"answer":2,"why":"长度单位差 1000 倍。"},"links":["motor-sizing","beam","materials-metrics"],"sources":["T6"],"visual":"units","level":"基础","table":null},{"id":"design-loop","module":"start","title":"工程闭环：模型、样机、测量与版本","goal":"知道一项设计什么时候才算完成。","core":[{"title":"四类证据","text":"手算解释主要物理关系；仿真处理复杂几何和边界；样机检查真实装配与工艺；试验给出特定条件下的测量结果。四者互相校核，任何一种都不能单独证明所有工况可靠。"},{"title":"把改动与结果关联","text":"每次变更记录版本、原因、影响零件、工艺和验证结果。例如把支架从平板改成折边，应比较同一载荷下位移，也检查折边是否挡住连接器。"},{"title":"复盘应能重现","text":"“优化了很多”不可复现。说明起始现象、测量条件、排除的原因、选择方案、结果和残余问题。没测过的收益用“预计”“待验证”，不编成功率或寿命。"}],"formula":"需求 → 概念 → 估算 → 详细设计 → 制造装配 → 测试 → 变更记录。","example":"样机孔位装不上：记录图纸版次与实测孔中心；核对基准和尺寸链；确认是加工偏差还是设计失配；改图或返修后复测。扩大孔可能解决装配，但也可能损害定位，需要一起评估。","pitfalls":["一次运行成功不等于完成寿命、环境和批量验证。","仿真云图截图若没有载荷、约束和单位，无法审查。"],"practice":"把你见过的一次“装不上”按现象、证据、原因、修改、复测五格写下来；不知道的格子保持空白。","quiz":{"q":"最能证明改动有效的证据是？","options":["新版本截图","同一测试条件下的前后数据及版本记录","零件看起来更厚"],"answer":1,"why":"可比条件与可追溯版本使结论能被复核。"},"links":["fea","test-plan","bom"],"sources":["R2","T15"],"visual":"flow","level":"基础","table":null},{"id":"materials-metrics","module":"materials","title":"性能指标：强度、刚度、硬度与韧性","goal":"把“这个材料很好”拆成可以比较的指标。","core":[{"title":"四个概念不能互换","text":"弹性模量 E 描述弹性区应力与应变关系；屈服强度描述开始发生规定塑性变形的应力；抗拉强度是拉伸过程中最大工程应力；硬度衡量局部压入等抗力。韧性关心吸收能量后抗断裂的能力，需结合试样和试验方法。"},{"title":"性能带着条件走","text":"同一种合金，不同热处理、厚度、温度、方向和制造过程都可能得到不同数据。塑料还特别受加载速度、持续时间和含水率影响。单一“强度值”不够描述一个工程材料。"},{"title":"轻量化不是单比密度","text":"比强度和比模量有助初筛，但梁、板、壳的几何对性能影响巨大。限外形尺寸、限挠度和限屈服的设计可能分别选出不同材料。先确定失效模式，再比较。"}],"formula":"线弹性单轴关系：σ = Eε。只适用于相应材料与弹性范围；不是断裂准则。","example":"铝板换成高强度铝板而几何不变：抗屈服能力可能提高，但由于 E 往往接近，弹性挠度未必显著下降。给薄板折边可能比只换牌号更有效。","pitfalls":["硬度高不等于抗冲击好。","“铝强度不够”要说明具体合金、状态和载荷。"],"practice":"拿一张纸先平放、再折成槽形，轻轻比较抗弯感觉。材料没变，改变的是截面；这不是金属材料强度试验。","quiz":{"q":"保持几何相同，E 提高一倍，理想弹性梁挠度如何变？","options":["约减半","必然不变","约增大一倍"],"answer":0,"why":"挠度与 E 成反比，但这不意味着屈服强度也提高一倍。"},"links":["beam","material-selection","fatigue"],"sources":["T1","T3"],"visual":"stress","level":"基础","table":null},{"id":"steels","module":"materials","title":"钢铁：Q235、45 钢、40Cr 与不锈钢","goal":"把板材、轴类和耐蚀外壳放到不同选择框里。","core":[{"title":"碳素钢与合金结构钢","text":"Q235 类结构钢常用于焊接架、板件等，经济且易获得；45 钢属常见中碳钢，轴类与一般机械件会关注其热处理状态；40Cr 等合金结构钢可通过合适调质获得强韧性组合。牌号体系不同，不应仅按名称把国标与海外牌号直接等同。"},{"title":"不锈钢不是绝不生锈","text":"304/316 属常见奥氏体不锈钢类别，316 中的合金设计有利于某些含氯环境的耐蚀性，但温度、浓度、缝隙和表面状态仍重要。冷加工后的磁性也不能单独用于鉴定牌号。马氏体、铁素体、双相不锈钢的处理与性能另有差别。"},{"title":"铸铁是另一类工具","text":"灰铸铁的片状石墨使其具备常见机床床身所需要的减振、铸造成形等优势，同时抗拉与缺口行为应审慎考虑；球墨铸铁通过石墨形态改变改善力学表现。不要把“铁”和“钢”当同一数据表。"}],"formula":"室温教学近似：常见钢 E≈200–210 GPa、密度≈7.8 g/cm³；具体强度必须按牌号、状态与标准查。","example":"教学选型：焊接设备底架先考虑结构钢与焊接变形；传递转矩的轴再考虑轴材、调质、轴肩疲劳；有清洗液的外罩需要查介质相容性。三者的主约束不同。","pitfalls":["不锈钢未必比所有碳钢更强，也未必适合所有氯环境。","镀锌板是钢基材加涂镀层，不能据此给出统一的钢种强度。"],"practice":"观察螺栓头上的等级与不锈钢标记，拍照查对应标准，不靠磁铁或颜色断定材料。","quiz":{"q":"为什么选择 316 仍要看环境？","options":["所有不锈钢都会立即生锈","腐蚀取决于介质、温度、缝隙与表面等条件","316 没有铬"],"answer":1,"why":"牌号只能缩小候选范围，不能替代服役条件。"},"links":["surface","bolts","fatigue"],"sources":["N4","N5","T26"],"visual":"material","level":"基础","table":null},{"id":"alloys","module":"materials","title":"铝、铜、钛：轻、导热与强度的取舍","goal":"认识 5052、6061、6063、7075，而非把它们统称铝合金。","core":[{"title":"铝合金先分成形路线","text":"5052 等 5 系板材常用于需要折弯的零件；6061 兼顾加工、连接和综合性能；6063 常见于挤压型材；7075 常用于有高强需求的部位，但要考虑状态、耐蚀和连接。压铸铝如 ADC12 是另一成形体系，不能把 6061 板料规则直接搬到压铸件。"},{"title":"状态决定很多事情","text":"T6 通常涉及固溶热处理后人工时效；O 是退火状态；H 系列与加工硬化状态有关。焊接会改变局部状态，例如 6061-T6 焊缝附近可能软化；材料名后面的状态和产品规格需要写清楚。"},{"title":"其他金属不是万能升级","text":"铜导电导热好但密度和成本较高；黄铜常用于接头等；钛合金的比强度、耐蚀性有吸引力，但加工、成本与导热不一定有利。异种金属接触在有电解质时可能发生电偶腐蚀，需要隔离与表面设计。"}],"formula":"铝的教学近似 E≈70 GPa、ρ≈2.7 g/cm³；铜约 8.9、钛约 4.5 g/cm³。这些不是强度允许值。","example":"机器人相机支架先用 6061-T6 小批 CNC；若改为折弯铝板，需要重新核对板材状态和内 R，而不是保留原 CNC 材料名就交厂。换工艺同时改变了可制造形状与性能。","pitfalls":["7075“更强”不保证同外形刚度显著更大。","阳极氧化适用性、外观与导电接触需要按合金和功能讨论。"],"practice":"找一段铝型材，观察沿长度方向截面是否恒定，理解为什么挤压工艺适合这种几何。","quiz":{"q":"把 6061-T6 焊接后，强度一定保持原数据吗？","options":["一定","不一定，热影响区状态可能改变","只看颜色"],"answer":1,"why":"焊接热循环可能改变强化状态，必须按实际接头与处理评估。"},"links":["material-selection","sheet","casting"],"sources":["T3","N6"],"visual":"material","level":"基础","table":null},{"id":"polymers","module":"materials","title":"工程塑料：ABS、PC、PA、POM、PP、PEEK","goal":"按外壳、滑动件、齿轮和高温件来记材料。","core":[{"title":"先看时间和环境","text":"塑料会蠕变，长期压紧后的尺寸可能变化；玻璃化温度、熔点和热变形温度不是同一个概念。热变形温度由规定载荷试验得到，不等于任何工况下可持续使用的温度。湿度、清洁剂、紫外线和阻燃等级都要看具体牌号。"},{"title":"用功能建立材料地图","text":"ABS 常用于外壳，PC 常用于强调冲击或透明的部位；PA 耐磨且常用于机械件，但吸水会影响尺寸和性能；POM 滑动和尺寸稳定表现常有优势；PP 可用于耐化学和活铰链设计；PEEK 用于更苛刻工况但成本高。PTFE 低摩擦与耐化学突出，同时需关注冷流与低刚度。"},{"title":"改性会改变排序","text":"玻纤增强可提高某些方向的刚度，带来各向异性、翘曲和表面差异。阻燃、润滑、耐候和增韧牌号不能与普通树脂混用数据。没有“所有 ABS 都阻燃”这样的规则。"}],"formula":"总变形可包含瞬时弹性、黏弹性与长期蠕变；不要只拿短时拉伸模量预测几年后的预紧保持。","example":"教学案例：小齿轮候选 PA 与 POM。除负载和磨损，还比较湿度、噪声、啮合温升、成形收缩和尺寸变化。若精度容易受环境影响，PA 的调湿条件必须进入测量与试验计划。","pitfalls":["POM、PA 常见于齿轮不代表任何载荷都可以替代钢。","塑料柱开裂也可能来自螺钉、应力集中、化学介质，不能只归因于材料脆。"],"practice":"比较瓶盖的 PP 标识与透明罩的材料标识；只观察弹性与表面，不燃烧塑料来鉴别。","quiz":{"q":"PA 精密滑块要额外关注什么？","options":["湿度与含水状态","只关注颜色","必定比所有金属更耐热"],"answer":0,"why":"吸湿可能改变尺寸、刚度和韧性。"},"links":["injection","seals","material-selection"],"sources":["N1","N2","N3"],"visual":"materials","level":"基础","table":null},{"id":"surface","module":"materials","title":"热处理与表面：改变的是基体还是外层","goal":"讲清调质、渗碳、阳极氧化、镀锌和喷涂。","core":[{"title":"热处理不只是变硬","text":"钢的退火、正火、淬火、回火分别服务于组织、应力、加工性与性能调整；调质通常指淬火加高温回火。渗碳后淬火让表层耐磨、心部保持一定韧性；氮化也是表面强化路线。具体温度和硬度必须按材料与工艺规范确定。"},{"title":"表面处理影响功能尺寸","text":"阳极氧化在铝表面形成氧化层；镀锌为钢提供屏障和牺牲保护；喷粉/喷漆可改善外观和环境耐受。涂层会影响配合、螺纹、导电、胶接、热接触和疲劳，关键面可能需要遮蔽或后加工。"},{"title":"先找腐蚀和磨损路径","text":"有水、有盐、缝隙、异种金属接触和涂层破损的部位需要单独处理。锌自己氧化参与保护钢基体，“镀锌板容易氧化所以必须喷漆”过于笼统；是否增加涂层取决于环境、外观与寿命目标。"}],"formula":"配合设计应考虑最终状态：基材尺寸 + 表面层 / 后加工对最终尺寸的影响。","example":"铝壳体轴承孔阳极后装不进：检查图纸定义的是处理前还是处理后尺寸、膜厚范围、是否遮蔽以及实际孔径。不能直接让装配人员强压。","pitfalls":["材料的热处理状态与表面涂层不是同一栏。","高强紧固件某些电镀工艺还涉及氢脆控制，应按合适规范执行。"],"practice":"观察一块喷涂板的螺纹孔和接地接触面是否遮蔽，思考为什么这些位置不一定需要同样涂层。","quiz":{"q":"表面处理后配合失效，首先核对什么？","options":["颜色是否均匀","图纸的最终尺寸状态和处理影响","换更大锤子"],"answer":1,"why":"关键尺寸必须与制造状态一致。"},"links":["fits","cnc","bolts"],"sources":["T23","T3","T26"],"visual":"layers","level":"基础","table":null},{"id":"composites","module":"materials","title":"橡胶、复合材料与胶：柔软也需要设计","goal":"理解密封件、减振垫、碳纤维和胶接的边界。","core":[{"title":"橡胶先问介质与温度","text":"硅橡胶、NBR、EPDM、FKM 的适用介质、温度与机械表现不同；不能只按 Shore 硬度选。压缩永久变形、回弹、老化和接触压力决定长期密封。减振垫过软会使姿态变化或碰限位。"},{"title":"纤维方向就是设计变量","text":"纤维增强材料沿纤维方向与横向性能可能差别很大；铺层、孔边应力、分层、连接压溃与冲击损伤都重要。“碳纤维比钢强”不能直接变成各方向的许用值。与铝接触还要评估电偶腐蚀。"},{"title":"胶层也是零件","text":"胶接需要表面处理、合适胶层厚度、固化条件和剥离控制。搭接剪切通常比纯剥离更有利，但实际分布不均。螺纹锁固胶与结构胶不是同一用途；可拆卸性、温度与介质要进入选择。"}],"formula":"层合板不能默认使用各向同性 E；减振系统固有频率同时取决于等效刚度和质量。","example":"教学案例：相机底座加软橡胶垫后，高频振动可能变小，但低频晃动和瞄准误差变大。要按频率、载荷和位移限制设计，而不是“越软越减振”。","pitfalls":["密封圈硬度不是唯一参数。","纤维表面看不出内部是否有分层，不应只凭外观验收。"],"practice":"用橡皮与纸板搭一个低载荷模型，观察静态下沉和晃动；只做桌面轻物演示，不拿真实设备做跌落。","quiz":{"q":"碳纤维板的性能是否各方向相同？","options":["一定相同","取决于纤维与铺层，通常要按方向看","只取决于颜色"],"answer":1,"why":"复合材料需要考虑各向异性和制造细节。"},"links":["seals","vibration","joining"],"sources":["N3","T30","N24"],"visual":"layers","level":"基础","table":null},{"id":"material-selection","module":"materials","title":"读数据表：从材料家族走到可采购牌号","goal":"把初选变成能交给供应商的材料要求。","core":[{"title":"建立筛选顺序","text":"先排除温度、介质、阻燃或制造路线不适合的材料，再比较密度、E、强度、疲劳、成本与供应。不要用未经标定的雷达图代替真实工程数据。本站材料图仅用于数量级直觉。"},{"title":"记录数据的条件","text":"抄下牌号、状态、产品形态、厚度、测试标准、温湿度、方向和取值类型。典型值、最低保证值和设计许用值不相同。塑料的干态/调湿态、金属的焊后状态尤其容易漏掉。"},{"title":"给采购和验证留证据","text":"规格应可采购、可复查：材料证明、批次、必要的硬度或成分检查。供应商替代牌号要验证关键性能与工艺影响，而非只比较材料名称相似。"}],"formula":"允许材料候选集 = 功能约束 ∩ 工艺约束 ∩ 环境约束 ∩ 供应与成本约束。","example":"教学选择：载荷由刚度控制的短支架，先固定空间、计算所需 EI，再比较钢板折弯与铝件截面，而不是只比较两种材料的屈服值。若工艺改变，需要同步重算截面和成本。","pitfalls":["某一厂家产品的典型值不能作为所有同类材料的保证值。","“环保”“食品级”等属性需要对应牌号、用途与认证范围，不能泛化整个材料家族。"],"practice":"打开一份 6061 或 POM 数据表，只摘录一个指标及完整试验条件，练习用一句话说明它能证明什么。","quiz":{"q":"数据表的典型拉伸强度可以直接当所有批次的许用应力吗？","options":["可以","不可以，还需保证范围与设计准则","典型值一定最低"],"answer":1,"why":"材料数据、保证条件和设计许用值是不同层级。"},"links":["alloys","polymers","beam","dfma"],"sources":["T3","N3","N6"],"visual":"materials","level":"基础","table":null},{"id":"loads","module":"mechanics","title":"受力分析：从真实物体到自由体图","goal":"找到载荷从哪里来、经过哪里、由谁承受。","core":[{"title":"隔离研究对象","text":"把支架、轴、整机分别隔离，不能把内部力在同一自由体里重复计算。标重力、惯性需求、接触力、摩擦、支反力和力矩，力臂必须垂直到作用线。"},{"title":"静力与动力分开","text":"静止或准静态时用合力和合矩为零；加速时用 ΣF=ma、绕固定轴的转动关系 ΣT=Jα 等适用模型。落地冲击不能简单以重量代替，接触时间、刚度和速度会影响峰值。"},{"title":"连接数多不等于平均分担","text":"多支撑可能超静定，需要变形协调和刚度关系。脚端反力随姿态、重心、加速度和接触状态变化，不能把整机重量直接平均分到每条腿。"}],"formula":"ΣF = ma；静止时 ΣF=0、ΣM=0。力矩向量 M = r×F。","example":"水平机械臂：臂质量 2 kg，重心离关节 0.15 m；末端负载 1 kg，距离 0.30 m。静态重力矩约 5.89 N·m。只算末端会漏掉臂本身；加速和其他姿态仍未校核。","pitfalls":["质量转动惯量 J 与截面惯性矩 I 不同。","不知道冲击时程时，说明假设与待测量，不把随意乘倍数称为已验证。"],"practice":"给桌边伸出的尺画一张自由体图，标固定处的剪力和弯矩，暂时不代公式。","quiz":{"q":"水平臂的电机选型只需末端重量乘臂长吗？","options":["是","否，还要臂自重、惯性、传动、热等","只要看额定功率"],"answer":1,"why":"这仅是静态负载的一部分。"},"links":["beam","motor-sizing","robot-kinematics"],"sources":["T2","N18"],"visual":"beam","level":"基础","table":null},{"id":"beam","module":"mechanics","title":"强度与刚度：加筋究竟改变了什么","goal":"亲手调厚度，看挠度为何变化得比重量更快。","core":[{"title":"强度与刚度解决不同问题","text":"强度关注屈服或断裂，刚度关注变形是否超过功能限制。相机没有掉下来，但挠度使光轴偏移，仍是不合格。理想梁只能帮助理解主导因素，连接处柔度也会使实际变形更大。"},{"title":"远离中性轴的材料更有用","text":"矩形截面抗弯惯性矩随弯曲方向高度 h 的三次方变化。折边、筋和箱形截面把材料移远，可提高抗弯能力；还要检查局部屈曲、连接、应力集中和加工。"},{"title":"模型条件写在公式旁","text":"实验使用等截面、细长、线弹性、小变形悬臂梁，理想固支、端部集中力。短厚梁、塑性、大转角、复杂开孔或接触不能无条件套用。变形图放大显示，计算数值不放大。"}],"formula":"I=bh³/12；Mmax=FL；σmax=Mmax·(h/2)/I；δ=FL³/(3EI)。N、mm、N/mm² 一致。","example":"F=20 N，L=100 mm，b=20 mm，h=5 mm，E=70000 N/mm²：I≈208.3 mm⁴，σ≈24 MPa，δ≈0.457 mm。若要求 δ≤0.2 mm，则刚度不足；将 h 加倍，理想挠度减为 1/8。","pitfalls":["换高强铝不保证同截面挠度下降。","“安全系数大于 1”必须说明相对于哪一种失效与工况。"],"practice":"用下方实验先预测结果，再改变 h 和 b。每次只改一项，比较重量、应力和位移。","quiz":{"q":"同材料同载荷，把悬臂长度减半，理想挠度变成？","options":["1/2","1/4","1/8"],"answer":2,"why":"端载悬臂挠度与 L³ 成正比。"},"links":["materials-metrics","fatigue","cnc","fea"],"sources":["T1","T2"],"visual":"beam","level":"基础","table":null},{"id":"torsion","module":"mechanics","title":"轴与组合载荷：弯、扭、拉常常一起出现","goal":"别把传递转矩的轴当成只受扭。","core":[{"title":"传动轴通常也受弯","text":"齿轮啮合力、带张力和悬臂负载会引入弯矩，轴肩和键槽带来应力集中。先求轴承反力与弯矩，再检查弯扭组合，必要时检查轴挠度与扭转角。"},{"title":"强度理论有适用对象","text":"常见延性金属屈服可用 von Mises 或 Tresca 等准则评估；脆性材料、疲劳、接触和稳定问题需相应方法。等效应力云图不是所有失效的共同答案。"},{"title":"几何过渡与连接","text":"轴径增大可降低应力，但重量和轴承尺寸增加；圆角有利于应力过渡，却必须与轴承倒角、定位面和装配工具兼容。空心轴的材料利用率可能更好，但连接和局部失效要核查。"}],"formula":"圆轴线弹性扭转：τmax=Tr/Jp；φ=TL/(GJp)。实心圆轴 Jp=πd⁴/32。","example":"教学轴：直径 10 mm，传递 1 N·m，最大名义扭转切应力约 5.09 MPa。这个结果没有包括弯曲、键槽、疲劳或连接，不能据此宣布轴安全。","pitfalls":["截面极惯性矩 Jp 不是质量转动惯量。","轴径不是只由静强度决定，配合、挠度、临界转速与标准轴承也有影响。"],"practice":"画一根带齿轮的轴，标径向、切向力与轴承位置，识别哪一段弯矩可能最大。","quiz":{"q":"为什么纯扭转计算可能低估轴风险？","options":["轴常同时受弯且存在应力集中","扭矩单位不能换算","轴承没有载荷"],"answer":0,"why":"真实载荷、连接和循环应力都要纳入。"},"links":["bearings","shafts","fatigue"],"sources":["T2","T9"],"visual":"shaft","level":"基础","table":null},{"id":"fatigue","module":"mechanics","title":"疲劳与断裂：为什么没超屈服也会坏","goal":"从“最大应力”转向整个载荷循环。","core":[{"title":"循环载荷改变问题","text":"疲劳损伤与应力幅、平均应力、循环次数、表面、尺寸、缺口和环境有关。转轴承受方向固定的弯矩时，表面材料点可能经历交变应力；一次静载试验看不出完整寿命。"},{"title":"裂纹有起点与发展","text":"孔边、轴肩、焊趾和加工划痕可能是应力集中点。断口上的特征能提供线索，但照片不能单独确定材料缺陷或具体寿命，需要载荷历史、材料检验与断口分析。"},{"title":"用合适的寿命模型","text":"S-N 曲线与试样条件、应力比等相关，不能直接把所有零件套一个疲劳极限。变幅载荷可在适用条件下用累计损伤方法估计，结果依赖输入与模型，需要验证。"}],"formula":"σa=(σmax−σmin)/2；σm=(σmax+σmin)/2。Miner 线性累积 D=Σ(ni/Ni) 是近似模型，不是通用保证。","example":"同一支架：静载 20 N 与每天反复 0→20 N 并不等价。若改动孔边圆角、表面质量或连接预紧，即使名义最大应力不变，疲劳表现也可能变化。","pitfalls":["铝合金不能随意套用“无限寿命疲劳极限”。","减薄后的应力集中和局部振动可能抵消减重收益。"],"practice":"查看 NASA 车轮案例，分别写下照片直接可见的损伤和仍需证据才能判断的原因。","quiz":{"q":"静态安全系数较大能否自动保证疲劳寿命？","options":["能","不能","只看颜色云图即可"],"answer":1,"why":"疲劳需要载荷谱、材料疲劳数据及实际细节。"},"links":["bolts","vibration","failure","case-rover"],"sources":["T2","T29","N21"],"visual":"fatigue","level":"基础","table":null},{"id":"buckling","module":"mechanics","title":"失稳、接触与冲击：公式之外的载荷条件","goal":"理解细长杆突然侧弯、跌落峰值和接触压痕。","core":[{"title":"压杆可先失稳后屈服","text":"细长受压构件可能在材料达到屈服之前发生屈曲。端部约束、初始弯曲、偏心和有效长度很重要；薄板也可能局部失稳，不能仅靠截面平均应力判断。"},{"title":"跌落能量不是峰值力","text":"落差 h 对应重力势能 mgh；停止距离与接触过程决定如何转化成变形和耗散。用能量除停止距离只能估平均量级，峰值还依赖刚度、阻尼和时程。"},{"title":"接触面积决定局部现象","text":"轮子、轴承和球头的实际接触区可能很小，局部应力高于名义平均值。塑料垫片和软层能扩展接触，也可能蠕变；要根据功能评价。"}],"formula":"理想细长弹性压杆 Pcr=π²EI/(KL)²。K 由理想端部条件决定；真实结构需考虑缺陷等。","example":"教学比较：同截面长杆长度翻倍，Euler 理想临界载荷变为 1/4。一个短粗支柱可能由压溃而非 Euler 屈曲控制，不能机械套公式。","pitfalls":["1 m 跌落不对应一个固定“g 值”。","防撞软垫要留足压缩行程，否则触底后载荷仍可能很高。"],"practice":"用一条纸带沿长度轻轻压缩，观察初始弯曲如何影响侧弯方向；这是直觉模型，不测工程临界载荷。","quiz":{"q":"同样跌落高度，停止距离更短通常意味着？","options":["平均减速度更大","一定更安全","冲击力固定不变"],"answer":0,"why":"同样能量在更短距离消耗会提高平均作用力，峰值仍需动态分析。"},"links":["beam","vibration","test-plan"],"sources":["T2","T30"],"visual":"buckling","level":"基础","table":null},{"id":"dof","module":"mechanisms","title":"自由度、约束与死点","goal":"电机数量不是机构自由度的定义。","core":[{"title":"从独立变量数理解","text":"自由刚体在空间有 6 个自由度，平面有 3 个。运动副减少相对自由度，闭环还带来约束。驱动数、机构自由度和可控性相关，却不是同一个指标。"},{"title":"公式需要独立约束","text":"平面机构常用 M=3n−2j₁−j₂，n 为活动构件数。复合铰链、局部自由度、重复约束和特殊几何需要处理，否则算出数字也可能误判运动。"},{"title":"死点与过约束","text":"四杆机构在特殊共线位形可能传力和运动出现问题；过多刚性定位可能在制造误差下卡住。设计常需要明确主基准，并用浮动端吸收非功能方向误差。"}],"formula":"普通平面四杆：3 个活动构件、4 个转动副，M=3×3−2×4=1。","example":"教学例：两条平行导轨如果都严格限制所有侧向误差，安装不平行时可能卡滞。改善不只是“上更强电机”，还可调整定位策略、装配基准和导轨形式。","pitfalls":["一个电机可带动多个连杆；多个电机也可能互相约束。","自由度正确不代表整个运动范围无干涉。"],"practice":"观察剪刀、抽屉或台灯，指出每个运动副允许什么运动、限制什么运动。","quiz":{"q":"自由度主要由什么决定？","options":["电机品牌","独立构型变量与约束","零件颜色"],"answer":1,"why":"驱动数量不直接定义自由度。"},"links":["robot-kinematics","datums","cad"],"sources":["T4"],"visual":"linkage","level":"基础","table":null},{"id":"gears","module":"mechanisms","title":"齿轮、行星与谐波：减速带来的交换","goal":"同时看到转速、转矩、刚度、背隙和效率。","core":[{"title":"齿轮啮合的基本量","text":"圆柱齿轮分度圆直径 d=mz；标准参数组合与齿形影响正确啮合。传动比、中心距、模数和齿数不能随意独立修改。斜齿通常还引入轴向力，需要相应支撑。"},{"title":"减速器的结构取舍","text":"行星可同轴布置并分担载荷；谐波通过柔轮弹性变形实现齿数差减速；摆线类也有其承载与制造特点。低背隙不等于无限刚度，受载扭转变形会影响输出定位。"},{"title":"从规格表走到总成","text":"核对连续和瞬时承载、转速、寿命、扭转刚度、效率、输出轴承载荷、润滑和热条件。电机编码器看到的角度经过减速器后，不能完全代表负载端真实角度。"}],"formula":"i=n输入/n输出；T输出≈η·i·T输入。外啮合齿轮转向相反，理想速比与齿数比相反。","example":"输入 1800 r/min、0.25 N·m，i=30、η=0.8，输出约 60 r/min、6 N·m。若效率或热限制不满足，不能只凭该乘法宣称可长期输出。","pitfalls":["“零背隙”不等于零传动误差或零弹性变形。","减速比提高会改变速度、反驱和控制，不能无限增大。"],"practice":"用齿轮实验改变齿数，观察转速和方向；同时看输出功率为何不能超过输入功率。","quiz":{"q":"减速后转矩增大，功率会凭空增大吗？","options":["会","不会，转速降低且有损耗","由齿轮颜色决定"],"answer":1,"why":"理想功率守恒，真实传动有损耗。"},"links":["motor-sizing","bearings","control-mechanics"],"sources":["T7","T6"],"visual":"gear","level":"基础","table":null},{"id":"belt-chain","module":"mechanisms","title":"带与链：张紧力也会加载到轴承","goal":"能跨距离传动，也会带来柔性与维护。","core":[{"title":"摩擦带、同步带和链不同","text":"摩擦带依靠摩擦传力，可有滑动；同步带以齿啮合传力，不应当作绝不会跳齿的刚体；链可承受较大载荷，但存在多边形效应、磨损和润滑需求。"},{"title":"预紧不是越大越好","text":"带的紧边与松边张力差传递转矩，两侧张力又共同作用到轮轴。过松可能跳齿或打滑，过紧增加轴承负载、摩擦与寿命风险。"},{"title":"布局决定可维护性","text":"检查中心距、包角、张紧方式、轮对中、护罩、环境和更换路径。长跨距及柔性可能降低系统固有频率，对位置控制产生影响。"}],"formula":"简化传力：T=(F紧−F松)r；轴承载荷取决于两边张力的矢量合成，而非只有差值。","example":"教学例：两个滑台速度一样，但一个皮带张得很紧。电机转矩可能相近，轴承径向负载却更大。验证时同时测运行电流、温升、噪声与带张力。","pitfalls":["同步带没有明显滑动不代表没有弹性定位误差。","链条伸长常来自销轴等处磨损，不只是链板拉长。"],"practice":"观察打印机同步带或自行车链条的张紧和对中方式，保持断电或静止，不把手放入运动部件。","quiz":{"q":"带的预紧过大会直接增加什么？","options":["轴承负载","电池容量","编码器分辨率"],"answer":0,"why":"两边带张力的合力作用在轴上。"},"links":["bearings","vibration","control-mechanics"],"sources":["T2","T9"],"visual":"belt","level":"基础","table":null},{"id":"screw-cam","module":"mechanisms","title":"丝杠、齿条与凸轮：旋转怎样变直线","goal":"看到导程、推力、精度与反驱的联系。","core":[{"title":"丝杠把一圈换成一个导程","text":"导程是每转的轴向位移，单线螺纹时等于螺距，多线时不同。滚珠丝杠常有较高效率，普通滑动丝杠可有较高摩擦，但是否自锁仍取决于结构、摩擦和工况。"},{"title":"选择不只看推力","text":"考虑行程、速度、轴向刚度、背隙、支撑方式、压杆稳定、临界转速、润滑和寿命。竖直轴通常需要考虑断电下滑与独立保持措施。"},{"title":"凸轮与齿条的选择","text":"凸轮能把预定运动规律固化为几何，接触力、压力角、加速度与冲击需要分析；齿条适合较长行程，但背隙、导向和润滑仍决定实际表现。"}],"formula":"理想化丝杠 T≈F·p/(2πη)；p 用 m/rev，F 用 N，T 为 N·m；v=n·p/60。","example":"F=100 N、导程 5 mm、效率 0.9，匀速推力对应转矩约 0.088 N·m。还没包含加速、预紧和支撑摩擦，也没校核竖直保持。","pitfalls":["滚珠丝杠不能默认自锁。","微步分辨率很细，不表示滑台实际精度同样细。"],"practice":"转动一支螺纹调节脚，测一圈前后的高度差，理解导程；不要带电测高速丝杠。","quiz":{"q":"导程翻倍且推力与效率不变，所需转矩？","options":["约翻倍","减半","不变"],"answer":0,"why":"T 与导程成正比，旋转一圈做更多直线功。"},"links":["steppers","buckling","motor-sizing"],"sources":["T2","T6"],"visual":"screw","level":"基础","table":null},{"id":"robot-kinematics","module":"mechanisms","title":"机器人运动学：关节角怎样变成末端位置","goal":"用两连杆看到正解、逆解和奇异位形。","core":[{"title":"先正解，再逆解","text":"正运动学由关节变量求末端位姿；逆运动学由目标位姿求可能的关节变量，可能多解、无解或需要迭代。坐标系方向、单位与零位不一致会使正确公式得到错误动作。"},{"title":"雅可比连接速度与力","text":"局部关系为末端速度=J(q)·关节速度；适当坐标表达下，静态末端力可映射为关节力矩 τ=JᵀF。质量、重心与动力学项还要另外加入。"},{"title":"奇异不是电机坏了","text":"当雅可比失去通常的秩，某些运动方向的能力退化。两连杆完全伸直时，不能用有限的一阶关节速度立刻向伸长方向移动；控制和路径规划需要避开或妥善处理。"}],"formula":"平面 2R：x=L₁cosq₁+L₂cos(q₁+q₂)；y=L₁sinq₁+L₂sin(q₁+q₂)。","example":"两段各 150 mm 的平面臂，完全伸直时末端距离 300 mm。目标超过此最大距离时，单靠修改控制参数不能实现；需要改结构或需求。","pitfalls":["关节空间精度不等于末端各处都相同的精度。","静态 τ=JᵀF 不能替代完整动力学。"],"practice":"拖动两关节角度，观察末端轨迹与工作空间边界；在第二关节接近 0° 时关注提示。","quiz":{"q":"逆运动学是否永远只有一个解？","options":["是","不是，可能多解或无解","与臂长无关"],"answer":1,"why":"工作空间、关节限制和几何决定可达性与分支。"},"links":["loads","servo","control-mechanics"],"sources":["N18","N19"],"visual":"arm","level":"进阶","table":null},{"id":"bearings","module":"components","title":"轴承：径向、轴向、力矩与寿命","goal":"先决定怎样支撑，再挑型号。","core":[{"title":"载荷方向决定候选","text":"深沟球轴承常见于径向及一定轴向组合载荷；角接触球轴承可面向组合载荷，通常需要成对或相应布置；圆柱滚子常见于较高径向载荷；圆锥滚子可承受组合载荷；交叉滚子用于需要多方向承载的紧凑支撑。实际能力看具体型号。"},{"title":"固定端与游动端","text":"支撑应约束需要约束的自由度，同时给热膨胀和误差留通道。两个端部都强行轴向锁死，可能产生额外载荷。预紧可提高刚度和减小游隙，却也增加发热，不能无限加。"},{"title":"疲劳寿命不是总寿命","text":"基本额定寿命 L10 表示规定条件下轴承群体的滚动疲劳统计寿命，通常对应 90% 可靠度；润滑、污染、安装、磨损、静载压痕及小角度摆动可能先限制真实应用。"}],"formula":"L10=(C/P)^p，单位百万转；球轴承 p=3，滚子 p=10/3。C、P 的定义必须按轴承手册求取。","example":"若球轴承等效载荷加倍且其他假设不变，理论 L10 降为 1/8。为了提高刚度而过度张紧皮带，可能因此明显损害轴承寿命。","pitfalls":["不能只按内径选轴承。","摆动关节不能仅按连续旋转寿命公式判断。"],"practice":"在图里依次查看内圈、外圈、滚动体、保持架；思考轴向压装时载荷应通过哪一圈，避免压装力经过滚动体。","quiz":{"q":"载荷翻倍对理想球轴承 L10 的影响？","options":["变为一半","变为 1/8","没有影响"],"answer":1,"why":"在公式适用条件下寿命与载荷三次方成反比。"},"links":["shafts","fits","belt-chain"],"sources":["T8","T9"],"visual":"bearing","level":"基础","table":null},{"id":"bolts","module":"components","title":"螺栓：预紧力把零件夹成一体","goal":"理解螺钉为什么松，为什么拧更紧也可能坏。","core":[{"title":"先看连接怎样传力","text":"受控预紧使接触面保持压紧，横向载荷可由摩擦或专门定位结构承担。外拉力在螺栓与被连接件之间按刚度分配；分离后载荷路径改变。定位销、止口和螺钉常分担不同功能。"},{"title":"等级与拧紧方法","text":"常见 8.8 性能等级的数字表示名义抗拉强度与屈强比的规则，不等于具体尺寸下所有保证值。扭矩与预紧力受螺纹和支承面摩擦影响很大，应使用经过验证的工艺与合适工具。"},{"title":"松动不只是一种机制","text":"嵌入、塑料蠕变与热循环可能造成预紧损失；横向滑移可导致旋转松动。改进要针对载荷、接触、预紧保持、防松与材料，单换高等级螺栓未必解决。"}],"formula":"简化扭矩关系 T≈KFd；K 受润滑和表面影响，只能用于有依据的估算。不要用一个固定 K 覆盖所有螺栓。","example":"塑料外壳螺柱开裂：先看失效是在装配时还是运行后，再检查螺钉类型、底孔、旋入深度、扭矩、柱根圆角、熔接线和介质。不直接把原因归给“塑料不够强”。","pitfalls":["所有螺钉都承担精确定位会导致过约束。","扭矩达到不代表真实预紧力必然达到。"],"practice":"操作预紧示意实验，观察外拉载荷增大时夹紧力何时降为零；模型忽略塑性与复杂接触。","quiz":{"q":"防松的首要问题是什么？","options":["螺钉颜色","找到预紧损失与接触滑移的机制","无条件换 12.9"],"answer":1,"why":"应针对失效机制设计连接。"},"links":["fatigue","injection","datums"],"sources":["T24","T25","T26"],"visual":"bolt","level":"基础","table":null},{"id":"shafts","module":"components","title":"轴、键、花键与联轴器","goal":"传递转矩、定位轴向和允许误差是不同任务。","core":[{"title":"轴上零件怎么被约束","text":"轴肩、挡圈、锁紧螺母和端盖常用于轴向定位；键、花键、夹紧套或过盈用于传扭。挡圈槽、键槽和螺纹退刀槽会改变截面，需要纳入疲劳和装配分析。"},{"title":"联轴器不是万能纠偏器","text":"刚性联轴器要求较好的对中；弹性联轴器可在额定范围补偿角向、平行和轴向偏差，不代表能消除所有轴承附加载荷。高精位置控制还关注扭转刚度、背隙与共振。"},{"title":"装配路径也是设计","text":"轴承、齿轮和密封要能按顺序装上，并能拆下。给拉拔、压装、测量留空间；过盈配合既要检查接触压力，也要考虑装配工艺与温差。"}],"formula":"轴设计至少同时核对：弯扭强度、变形、连接、配合、轴向定位、装拆与制造。","example":"教学例：轴肩圆角加大降低应力集中，却与轴承内圈倒角干涉，使内圈贴不到肩部。可调整过渡、退刀槽或轴承形式，并重新检查强度和定位。","pitfalls":["键连接不能自动解决所有轴向定位。","用联轴器补偿明显安装错误可能导致发热和振动。"],"practice":"画一根“两轴承一齿轮”的剖面，沿轴向标出每个零件的安装顺序与定位面。","quiz":{"q":"联轴器允许偏差意味着可以不对中吗？","options":["可以","不可以，仍需在额定范围内对中","偏差越大越稳定"],"answer":1,"why":"允许补偿范围不是推荐长期偏差目标。"},"links":["torsion","bearings","fits"],"sources":["T9","T2"],"visual":"shaft","level":"基础","table":null},{"id":"seals","module":"components","title":"密封与润滑：控制泄漏，也控制磨损","goal":"把静密封、动密封和防尘区分开。","core":[{"title":"静态与动态密封","text":"O 形圈可用于合适的静密封与部分动密封场景，设计需要沟槽、压缩量、拉伸、间隙、介质与温度；旋转油封还受轴表面、线速度、偏心和润滑影响。具体比例与公差必须查相应厂家手册。"},{"title":"接触、非接触与呼吸","text":"接触密封可有较强阻隔但带来摩擦和磨损；迷宫式非接触方案依赖路径和环境，不代表水密。壳体温度变化导致内部压差，防护等级与透气设计须按完整总成验证。"},{"title":"润滑是一项持续条件","text":"润滑脂的基油、稠化剂、黏度、填充量和相容性影响性能。填得越满未必越好，可能搅拌发热；温度、速度与污染决定维护策略。"}],"formula":"泄漏、摩擦与寿命共同优化；密封设计参数不能只从硬度或外径推断。","example":"教学例：电机壳增加密封圈后温升升高，可能同时来自风路受限与密封摩擦。应分别比较空载电流、温升、密封接触和空气流动，而非立刻换更大风扇。","pitfalls":["有密封圈不等于整机达到某个 IP 等级。","两种润滑脂可混用与否需查相容性，不能只看颜色。"],"practice":"观察水杯盖中的密封圈与沟槽，想象压得过少、过多、扭曲各有什么后果。","quiz":{"q":"为什么不应把轴承腔无条件填满润滑脂？","options":["可能增加搅拌和发热","油脂不提供润滑","所有轴承必须干运转"],"answer":0,"why":"填充量取决于产品、速度和散热条件。"},"links":["composites","thermal","test-plan"],"sources":["T9","N3","N24"],"visual":"seal","level":"基础","table":null},{"id":"springs","module":"components","title":"弹簧与柔顺：储能、复位和缓冲","goal":"区分弹簧力、刚度、行程与预压。","core":[{"title":"力与刚度不是一回事","text":"在线性范围内，刚度是力对位移的斜率。预压让零位已有力，不等于改变线性弹簧本身刚度；多个弹簧串联和并联产生不同等效刚度。"},{"title":"弹簧也会失效","text":"关注最大应力、疲劳、固并高度、屈曲、腐蚀和高温松弛。拉簧钩部和扭簧支腿需要专门考虑。柔性铰链可减少间隙，但应变和运动范围有限。"},{"title":"柔顺带来取舍","text":"弹性夹爪可适应形状误差，串联弹性执行器可借弹性测力与吸收冲击，同时引入额外动态和控制问题。过软会降低定位精度与带宽。"}],"formula":"F=kx；线性储能 U=½kx²。并联 k总=Σk；串联 1/k总=Σ(1/k)。","example":"两个各 10 N/mm 的弹簧，并联刚度 20 N/mm，串联为 5 N/mm。相同总位移下的力不同，不能只看弹簧数量。","pitfalls":["弹簧可以储能，并不意味着能把能量自动耗散掉；阻尼负责耗散。","压到固并后原线性模型失效。"],"practice":"轻压圆珠笔弹簧观察复位，思考为什么需要限位；不要超行程拉伸。","quiz":{"q":"理想弹簧和阻尼器最主要的区别？","options":["弹簧储能，阻尼耗能","两者完全相同","弹簧只能传压力"],"answer":0,"why":"这是理解振动和减振的起点。"},"links":["vibration","control-mechanics","grippers"],"sources":["T30","T2"],"visual":"spring","level":"基础","table":null},{"id":"motor-types","module":"motors","title":"电机地图：结构、驱动与控制别混成一类","goal":"看懂有刷、无刷、步进、伺服和舵机的关系。","core":[{"title":"第一层：能量转换结构","text":"有刷直流电机用机械换向；无刷永磁电机用电子换相；感应电机通过转差产生转子电流；步进电机按定子励磁状态形成离散平衡位置。还包括直线电机、音圈等执行形式。"},{"title":"第二层：怎样驱动","text":"有刷常由 H 桥驱动；双极步进常用两组 H 桥和电流斩波；三相无刷常用三相逆变桥，采用六步或正弦电流控制等策略。供电是直流，不代表绕组只流恒定直流。"},{"title":"第三层：怎样形成系统","text":"伺服强调反馈控制的运动系统，可能采用永磁交流、有刷直流甚至闭环步进等结构。常见 hobby 舵机把电机、减速、反馈与控制封装起来；某些连续转动型号的接口代表速度而非角度。"}],"formula":"负载需求 → 电机本体 + 驱动功率级 + 传感器 + 控制器 + 传动。每层都有自己的限值。","example":"桌面小车用“有刷减速电机+编码器+H 桥+速度 PI”也能形成速度闭环。不能因为没有工业伺服包装就说它不是闭环系统，也不能把有编码器直接当作已闭环。","pitfalls":["“直流 / 交流”和“伺服 / 步进”并非一组互斥分类。","电机能转不说明驱动和控制满足精度与热需求。"],"practice":"打开电机分类图，逐个比较：谁换相、反馈是什么、输入命令是什么、典型失效是什么。","quiz":{"q":"伺服最准确地描述什么？","options":["一种固定材料的转子","带反馈的控制系统特征","必须没有减速器"],"answer":1,"why":"伺服是系统和控制属性，不能替代电机结构分类。"},"links":["brushed","steppers","bldc","servo"],"sources":["N7","N13"],"visual":"motor","level":"基础","table":null},{"id":"brushed","module":"motors","title":"有刷直流：H 桥、PWM 与反电动势","goal":"看懂最常见小车电机为什么会转、堵住为什么发热。","core":[{"title":"机械换向在转子里发生","text":"电刷与换向器按转角切换电枢电流，定子磁场与电流产生电磁转矩。电刷有磨损与电气噪声，但控制接口直观，适合很多低成本应用。"},{"title":"H 桥改变电压方向","text":"两组对角开关交替可使电机两端极性反向；PWM 改变平均施加电压。绕组电感使电流并非理想方波。实际驱动还需要续流路径、死区和过流保护，同桥臂上下管不能同时导通。"},{"title":"转矩看电流，转速看平衡","text":"电机旋转产生反电动势，与转速有关。负载增加时转速下降、电流增加；闭环控制再调电压使速度回到目标。堵转时反电动势很小，电流和铜耗可能很大。"}],"formula":"简化模型：V=RI+L·dI/dt+keω；T≈ktI；J·dω/dt=T−T负载−阻力矩。","example":"12 V 电机在固定负载下给 50% PWM，平均电压近似 6 V 的说法只适用于指定开关/续流模式的简化理解。转速不保证正好变成空载转速一半，更不等于精确速度闭环。","pitfalls":["PWM 占空比不是转速传感器。","堵转转矩不是长期工作能力；不要用手卡住实物电机验证。"],"practice":"调 PWM 占空比看波形，再调负载观察平均稳态速度。这里是教学模型，不是某一实际电机。","quiz":{"q":"为什么堵转容易发热？","options":["反电动势低，电流可能大","转速高","PWM 自动关掉所有电流"],"answer":0,"why":"需由电流限制、热保护和工况设计防止损坏。"},"links":["feedback","pid","motor-sizing"],"sources":["N8","N9","T28"],"visual":"pwm","level":"基础","table":null},{"id":"steppers","module":"motors","title":"步进电机：脉冲、细分、失步与闭环","goal":"“一脉冲一步”背后也有电流和动态限制。","core":[{"title":"励磁状态产生目标平衡位置","text":"驱动器依次改变相电流，让转子跟随旋转的磁场。常见 STEP/DIR 接口中脉冲数对应命令位移，频率对应命令速度；这不自动证明转子实际完成了命令。"},{"title":"细分改善平滑性，不保证同等绝对精度","text":"以近似正弦/余弦相电流细分磁场角度，可减少振动和噪声。摩擦、负载、齿槽和电流误差影响实际微步位置；保持转矩也不能代替高速运行转矩。"},{"title":"失步有机械和电气原因","text":"加速度过大、负载超限、共振、供电与电流不足都可能导致失步。应看指定驱动电压和电流下的转矩—转速曲线；闭环步进可检测/补偿一些偏差，但仍有物理能力上限。"}],"formula":"1.8° 整步为 200 步/转。16 细分的命令分辨率为 3200 脉冲/转；不等于实测绝对精度。","example":"5 mm 导程丝杠配 1.8° 电机、16 细分，命令位移增量 5/3200≈0.00156 mm。真实精度还受丝杠误差、背隙、变形、温漂与失步影响。","pitfalls":["保持转矩在零速额定电流条件下定义，不能当任意转速可用转矩。","只提高细分不一定改善承载定位能力。"],"practice":"在电机动画里切换整步与细分，观察磁场目标如何变化；思考负载滞后为什么不能从脉冲数直接看出来。","quiz":{"q":"3200 脉冲/转是否意味着每个微步都同样准确？","options":["是","否，命令分辨率不等于实际精度","完全不能控制位置"],"answer":1,"why":"需要结合负载、驱动与机构误差评估。"},"links":["screw-cam","feedback","motor-sizing"],"sources":["N10","N11"],"visual":"motor","level":"基础","table":null},{"id":"bldc","module":"motors","title":"无刷永磁电机：六步换相与正弦控制","goal":"用旋转磁场理解电子换相。","core":[{"title":"换向从机械触点变成电子开关","text":"三相定子绕组与永磁转子配合，由功率桥按转子状态安排电流。转子可在内侧或外侧；外转子几何可能提供较大力臂，但散热、惯量、速度和结构约束也随之改变。"},{"title":"BLDC 与 PMSM 的称呼","text":"工程中常用 BLDC 描述梯形反电动势/六步驱动相关设计，用 PMSM 描述正弦相关设计；实际产品命名与驱动策略并非完全一一对应。要看绕组、反电动势、传感与厂家推荐方式。"},{"title":"换相需要位置知识","text":"可用 Hall、编码器或无传感估计。无传感反电动势方案在静止和很低速时常有额外挑战，但不能据此说所有无传感方法都不能低速运行。低速力控需关注可观测性、估计与校准。"}],"formula":"三相电流可生成旋转磁场；电角度 θe=极对数 p×机械角度 θm（含安装零偏）。","example":"7 极对电机机械转一圈，电角度走 7 圈。把机械角直接当电角用于换相，会让电流方向与转子磁场错位，表现为发热、抖动或不转。","pitfalls":["三根粗相线不能由普通两线 H 桥直接等价控制。","无刷电机能运行不等于已做好力矩控制。"],"practice":"观察动画中定子磁场与转子磁极的位置关系；这是简化二维示意，不代表真实绕组槽极组合。","quiz":{"q":"7 极对电机的机械角变化 10°，电角变化？","options":["10°","70°","约 1.43°"],"answer":1,"why":"电角度按极对数放大。"},"links":["foc","feedback","thermal"],"sources":["N7","N12"],"visual":"motor","level":"基础","table":null},{"id":"ac-motors","module":"motors","title":"交流感应与同步：变频器到底改变什么","goal":"给工业设备和生产线岗位补上交流驱动基础。","core":[{"title":"旋转磁场与转差","text":"三相交流可形成旋转磁场，同步转速由电源频率和极数决定。感应电机需要转差来感应转子电流并产生相应转矩；永磁同步电机在稳定同步运行时转子跟随旋转磁场。"},{"title":"变频不只是调电压","text":"变频器改变输出频率、电压和电流波形；V/f 控制与矢量控制具有不同性能。转矩能力、低速冷却、高速弱磁和绝缘轴承等要求需要结合驱动与电机手册。"},{"title":"什么时候想到它","text":"风机、泵和输送设备常采用交流驱动。机器人关节常强调紧凑、动态、低速转矩与反馈精度，候选会不同。适用场景不是绝对排他，仍需从需求出发。"}],"formula":"同步转速 ns=120f/P，f 为 Hz，P 为极数；转差率 s=(ns−n)/ns。","example":"50 Hz、4 极的同步转速 1500 r/min。感应电机在某电动负载下若为 1440 r/min，则转差约 4%；这不是编码器天然少数了 60 转。","pitfalls":["同步转速不一定是感应电机的实际转速。","变频降速后不能自动假设自带风扇仍有额定冷却能力。"],"practice":"读一张工业电机铭牌，找频率、极数或额定转速、电压接法与工作制；不接触市电接线。","quiz":{"q":"4 极 50 Hz 电机的同步转速是多少？","options":["750","1500","3000 r/min"],"answer":1,"why":"ns=120×50/4。"},"links":["motor-types","foc","thermal"],"sources":["N14","N13"],"visual":"motor","level":"基础","table":null},{"id":"servo","module":"motors","title":"伺服、舵机与关节模组","goal":"“集成好了”之后仍然需要读哪些接口。","core":[{"title":"工业伺服系统","text":"典型系统含电机、编码器、驱动和控制器，常提供位置、速度、转矩模式。接口可能是脉冲、模拟量或总线，具体命令与控制环闭合位置看产品手册。"},{"title":"舵机与集成关节","text":"hobby 舵机的脉宽常代表目标角，但连续旋转舵机可能代表速度；总线舵机提供何种反馈因型号不同。关节模组可能集成减速器、驱动、编码器和刹车，但不一定有输出端力矩传感器。"},{"title":"反馈位置决定可见误差","text":"电机侧编码器看不到全部齿隙与输出轴弹性；双编码器或负载侧反馈能提供更多信息，却使控制、标定和共振处理更复杂。急停、制动器和失电行为也要定义。"}],"formula":"指令精度 ≠ 电机编码器分辨率 ≠ 关节绝对精度 ≠ 末端精度。","example":"教学关节：电机侧位置已到位，但长臂负载让减速器弹性扭转，末端仍下垂。可通过结构刚度、负载端测量与控制补偿改进；不能只提高编码器位数。","pitfalls":["转矩模式的电流估算不等于真实末端六维力测量。","断电保持可能依赖刹车或机械结构，不能假设所有减速器自锁。"],"practice":"对一份关节模组手册建立五行表：电源、通信、反馈位置、连续/峰值限制、断电行为。","quiz":{"q":"电机编码器已到位，末端还可能偏吗？","options":["不可能","可能，传动与结构有误差和柔度","只有软件才会产生误差"],"answer":1,"why":"完整误差链包括机械与热因素。"},"links":["foc","control-mechanics","robot-kinematics"],"sources":["N13","T7"],"visual":"control","level":"基础","table":null},{"id":"motor-sizing","module":"motors","title":"选型计算：工作周期、峰值和热","goal":"从“有一个电机”走到“它能满足这个工况吗”。","core":[{"title":"先得到负载侧需求","text":"画出速度、加速度和负载随时间的曲线；包括重力、滚阻、惯性、摩擦和外载。考虑不同姿态与最不利工况，再通过传动比和效率折算到电机。"},{"title":"匹配一组工作点","text":"检查各段的转矩—转速区域、峰值持续时间、连续热负荷、电流、电源电压、驱动限制和回馈能量。额定、峰值与堵转描述不同条件，不能按固定倍数互换。"},{"title":"再回到机械接口","text":"核对轴径、固定孔、径轴向载荷、减速器连续与瞬时承载、反驱、线束和冷却。选型最后需要有代表工况的温升、轨迹与负载验证。"}],"formula":"T电机≈T负载/(ηi)+J折算·α电机；J负载折算=J负载/i²（理想传动）。T_RMS=√(ΣT²t/Σt) 辅助热评估。","example":"负载静力矩 5.89 N·m，i=30、η=0.8，电机侧约 0.245 N·m；输出 60 r/min 对应电机 1800 r/min。还要叠加加速和查该工作点，不是挑“功率差不多”的电机。","pitfalls":["转矩正负抵消不代表发热抵消。","摩擦与回馈可能随方向改变，效率不能对所有状态机械套同一数值。"],"practice":"打开综合底盘案例，改变轮径；同时观察转速降低与转矩增加，避免只看到一项好处。","quiz":{"q":"峰值转矩足够，是否就能长期保持负载？","options":["能","不能，连续热负荷和驱动限制仍要查","只看减速比"],"answer":1,"why":"峰值许可受持续时间、温度、转速等限制。"},"links":["loads","gears","thermal","case-chassis"],"sources":["T5","T6","T28"],"visual":"system","level":"基础","table":null},{"id":"fluid-actuators","module":"motors","title":"气动、液压、音圈：电机之外的执行方式","goal":"理解推力、速度、柔顺与系统代价。","core":[{"title":"气缸与液压缸","text":"理论推力与压差和有效面积有关，回程因活塞杆占据面积通常不同。速度与流量、面积有关，还要考虑阀、管路、摩擦、缓冲和供能。气体可压缩，动态与保持行为不能直接套液压模型。"},{"title":"音圈与直线电机","text":"音圈常用于短行程、快速、平滑力输出，但需要导向、位置反馈和热设计。直线电机直接产生直线力，可减少中间传动，仍需导轨、测量、线缆与防护。"},{"title":"从任务选择","text":"夹紧与重复推送可比较气动；高力密度工况可比较液压；精密短行程可比较音圈；长行程需要考虑导向和供能。系统成本应包括气源、阀、驱动、维护和噪声。"}],"formula":"理论 F=Δp·A；理想 v=Q/A；实际力需扣摩擦并考虑负载率与背压。","example":"缸径 20 mm、有效压差 0.5 MPa，无杆侧理论力约 157 N；这是 π·20²/4×0.5，尚未扣除摩擦与动态余量。","pitfalls":["气缸额定压力不是任意场景可用的精确推力。","断电或失压后的运动需要在机构设计阶段考虑。"],"practice":"只在动画里比较缸径加倍后面积和理论推力；真实气液压系统需按设备程序操作。","quiz":{"q":"压差相同，缸径加倍，理论力变为？","options":["2 倍","4 倍","不变"],"answer":1,"why":"有效面积与直径平方成正比。"},"links":["grippers","feedback","test-plan"],"sources":["N16","N17"],"visual":"pneumatic","level":"基础","table":null},{"id":"feedback","module":"control","title":"传感器：电机转了，不代表负载到了","goal":"把编码器、Hall、电流、力和 IMU 放在正确位置。","core":[{"title":"量什么，就在哪里测","text":"编码器测角度或位移，增量式常需参考零位，绝对式给出编码位置但多圈能力和断电保持因型号而异。Hall 常用于换相位置；电流可估算电磁转矩，但输出还受摩擦和传动效率影响。"},{"title":"分辨率、精度、重复性不同","text":"高位数仅说明最小可表示步距，不自动保证准确。安装偏心、轴跳动、插值、噪声和温度影响测量；重复到同一错误位置可以重复性很好但准确度不好。"},{"title":"其他机器人传感器","text":"应变式力传感器需要标定和温漂补偿；IMU 测角速度和比力，不能靠积分无限保持位置准确；限位开关用于状态检测而非连续位置精测；视觉/深度信息受光照、视场、遮挡和标定影响。"}],"formula":"理想 N 位单圈编码器量化间隔 = 360°/2ᴺ；这不是系统准确度指标。","example":"12 位编码器理想间隔约 0.088°。若装在电机侧，经过减速比折算出的很小数字仍不包括齿隙、负载变形与编码器安装误差。","pitfalls":["有传感器但没把误差用于调节，仍不等于闭环。","IMU 上电后积分出的位移不能直接当作无漂移的定位。"],"practice":"在两个位置想象安装编码器：电机侧和负载侧。分别列出它看得到与看不到的误差。","quiz":{"q":"编码器位数增加一定提高整机绝对精度吗？","options":["一定","不一定，还受安装与机械误差限制","位数越高精度越差"],"answer":1,"why":"量化只是误差链中的一项。"},"links":["servo","metrology","control-mechanics"],"sources":["N13","N27"],"visual":"encoder","level":"基础","table":null},{"id":"pid","module":"control","title":"闭环与 PID：误差怎样变成纠正动作","goal":"通过响应曲线理解快、稳、准为何需要取舍。","core":[{"title":"负反馈闭环","text":"将目标与测量值比较，控制器把误差变成驱动输入。被控对象包含电机、传动、结构与传感延迟；控制器不能提供驱动没有的电流，也不能消除机械限位。"},{"title":"P、I、D 的角色","text":"P 对当前误差响应；I 累积误差，可改善某些稳态偏差，但饱和时会积累过多；D 对变化趋势响应，可增加阻尼，也会放大噪声。具体效果依赖系统，不是“P 越大越好”。"},{"title":"调参前先确定物理问题","text":"先核对方向、单位、传感器、摩擦、背隙、延迟和输出限制，再调参数。需要限幅、抗积分饱和及适当滤波。测试应在受控范围，记录超调、稳定时间、稳态误差和控制输出。"}],"formula":"u=Kp·e+Ki∫e dt+Kd·de/dt。本站演示用质量—阻尼模型，D 作用于测量速度以避免设定值跳变冲击。","example":"教学滑台遇到持续阻力，只有 P 时可能保留误差；加入 I 可减小偏差。但若电机已经饱和仍不断积分，解除负载后可能大幅超调，需要抗饱和处理。","pitfalls":["一套 PID 参数不能保证适用于所有质量和速度。","调大增益不能修好松动螺栓或严重卡滞。"],"practice":"先只开 P；加入 D 看超调变化；加入 I 后施加恒定扰动，观察误差与饱和。每次改变一个参数。","quiz":{"q":"积分饱和常发生在什么情况？","options":["执行器已达到输出限值但积分继续积累","系统没有任何误差","所有积分均为零"],"answer":0,"why":"需要让积分与真实可用输出一致。"},"links":["feedback","foc","control-mechanics"],"sources":["N25","N26"],"visual":"pid","level":"基础","table":null},{"id":"foc","module":"control","title":"三环与 FOC：位置、速度、电流各管什么","goal":"看懂电机控制框图，不把 FOC 当作“高级 PID”的别名。","core":[{"title":"串级环按任务分工","text":"典型位置环根据位置误差产生速度参考，速度环产生转矩或电流参考，电流环控制电磁转矩相关电流。内环通常需要更快，实际带宽、采样率和环结构依据系统设计，并非固定倍数。"},{"title":"FOC 在旋转坐标系里控制电流","text":"测得相电流后，通过坐标变换表达成随转子磁场旋转的 d、q 分量，使磁链和转矩相关量便于控制；再逆变换并通过 PWM 驱动三相桥。它需要角度信息或估计。"},{"title":"结构设计也影响控制结果","text":"电机参数、采样偏差、安装零位、极对数、延迟与电压限幅会影响控制。表贴永磁电机在一定条件下常令 id 近零，弱磁或凸极转子策略可能不同，不应把 id=0 当普遍定义。"}],"formula":"简化表贴 PMSM：T≈(3/2)·p·ψf·iq（需满足对应模型假设）；完整模型还可能包含磁阻转矩项。","example":"位置模式突然转矩不足：先查看是否触发电流或电压限制、输出速度是否超范围、负载是否卡住。即使位置误差大，控制器也不能无限增加转矩。","pitfalls":["FOC 是电流矢量控制方法，不自动等于已闭合位置环。","通过电流估算电磁转矩不等于准确测到末端接触力。"],"practice":"沿框图从位置目标走到三相电流，再沿传感器返回。分别指出通信命令、功率和反馈信号。","quiz":{"q":"速度环典型输出什么参考？","options":["转矩/电流参考","材料牌号","工程图尺寸"],"answer":0,"why":"电流内环更直接地调节电磁转矩。"},"links":["bldc","pid","servo","thermal"],"sources":["N12","N13"],"visual":"control","level":"进阶","table":null},{"id":"power-bus","module":"control","title":"驱动、电源与通信：机械同学必须懂的接口","goal":"分清命令信号、供电和制动能量。","core":[{"title":"功率路径与控制路径","text":"控制器的低功率 PWM/总线命令不能直接提供电机绕组功率，驱动器承担开关与电流控制。电源电压、电流能力、连接器额定和线缆压降要协调，堵转峰值不应只靠电池容量推算。"},{"title":"减速时能量去哪了","text":"机械动能在制动时可能回馈直流母线，也可能由电阻或其他路径耗散。电源未必能吸收回馈，母线过压风险与驱动策略相关。急停不是简单地切断某一根通信线。"},{"title":"总线不是同一种层级","text":"RS-485 主要规定电气层，通常还需要 Modbus 等上层协议；CAN 有相应链路和物理层要求，CANopen 等在其上定义设备行为。EtherCAT、脉冲、模拟量等接口的同步与诊断方式各异，要按实际手册集成。"}],"formula":"电线近似压降 ΔV=IR；铜耗 P=I²R。线径、长度、温升、走线和连接器共同决定可用性。","example":"教学小车加速时控制板重启：同时查看母线瞬降、接插件、供电分配、地参考和电机电流。不能直接认定“程序有 bug”，也不能只加大保险丝。","pitfalls":["相同接口外形不代表电气引脚和协议兼容。","急停和安全控制需依据设备风险与适用要求设计，普通教学闭环不是安全功能。"],"practice":"对示例系统画两种颜色的线：电源粗线与通信细线，标出驱动器、电机和传感器。","quiz":{"q":"RS-485 本身是否完整规定了上层设备指令？","options":["是","否，通常还需协议约定","它只用于机械传动"],"answer":1,"why":"电气层连接正确并不代表双方能理解数据。"},"links":["cabling","motor-sizing","risk"],"sources":["N28","N29","N7"],"visual":"wiring","level":"基础","table":null},{"id":"control-mechanics","module":"control","title":"结构与控制联动：背隙、弹性与共振","goal":"知道哪些问题不能靠软件单独补救。","core":[{"title":"机械不是理想刚体","text":"齿隙造成方向反转时的空行程；摩擦带来死区和滞回；柔性引入额外模态；传感器位置决定哪些变形能反馈。质量和惯量改变后，原控制参数可能不再适合。"},{"title":"刚度和带宽互相限制","text":"提高控制增益可能激起柔性模态。结构增刚、减小悬臂、改善支撑与传感布局，有时比继续提高采样率更有效。滤波可处理部分问题，也可能引入相位延迟。"},{"title":"协作的具体输入","text":"向控制同事提供质量、重心、惯量、减速比、摩擦/背隙估计、限位、速度和转矩边界；控制侧反馈轨迹、带宽、冲击、跟踪误差与热负载。两边用同一测试工况。"}],"formula":"简化柔性模态 fn≈(1/2π)√(k/m)。减重或增刚改变固有频率，但多自由度系统要看模态形状。","example":"机械臂末端振荡：比较电机侧与负载侧测量，检查是否与某一结构模态接近；先确认连接与装配，再做扫频或受控试验。不是一开始就把 D 调到最大。","pitfalls":["编码器反馈稳定并不能排除末端结构振动。","滤掉测量噪声也可能滤掉真实动态并增加延迟。"],"practice":"在 PID 实验改质量；再看振动实验的共振频率变化，写下机械改动如何影响调参。","quiz":{"q":"更换更重的夹爪后，控制还需要重新验证吗？","options":["不需要","需要，惯量与模态可能变化","只改颜色即可"],"answer":1,"why":"负载变化会影响动态和热负荷。"},"links":["vibration","servo","robot-kinematics"],"sources":["N12","T30"],"visual":"vibration","level":"进阶","table":null},{"id":"fits","module":"precision","title":"尺寸公差与配合：H7/g6 到底是什么","goal":"能算最小和最大间隙，而非只背代号。","core":[{"title":"尺寸带与位置","text":"公差等级 IT 表示在规定尺寸段内的公差宽度，字母表示基本偏差相关位置。大写用于孔、小写用于轴；H 孔下偏差为零、h 轴上偏差为零。数字 7 不是 7 μm。"},{"title":"间隙、过盈与过渡","text":"用孔与轴的实际极限尺寸求可能的间隙。始终有正间隙是间隙配合；始终有过盈是过盈配合；可能出现两种情况是过渡配合。具体选择要结合载荷、相对运动、拆装和温度。"},{"title":"尺寸正确也可能装不好","text":"形状、位置、粗糙度、倒角与最终表面处理都影响装配。轴承配合要按内外圈相对载荷的运动、温差与要求选择，不存在所有轴承都用同一组配合。"}],"formula":"间隙最小=孔最小−轴最大；间隙最大=孔最大−轴最小。负值表示相应情况下为过盈。","example":"标准尺寸段下的教学例：20 H7 孔 20.000～20.021 mm；20 g6 轴 19.980～19.993 mm；间隙 0.007～0.041 mm。其他尺寸需要重新查表。","pitfalls":["H7 不是“孔所有几何都很精”。","不能把车间通用加工精度当所有特征都能保证的精度。"],"practice":"在配合实验调整孔与轴上下限，先预测配合类型，再看公差带位置。","quiz":{"q":"20 H7 的 7 表示什么？","options":["7 μm","公差等级","孔有 7 个"],"answer":1,"why":"具体宽度取决于基本尺寸段。"},"links":["stack","gdt","bearings"],"sources":["T10","T9"],"visual":"fit","level":"基础","table":null},{"id":"stack","module":"precision","title":"尺寸链：谁在累积，谁负责最后间隙","goal":"从一条装配链看懂功能尺寸。","core":[{"title":"从功能间隙出发","text":"定义最后要保证的封闭环，再沿实际接触与定位关系寻找组成尺寸；改变一个尺寸看间隙增大还是减小，判断增环与减环。不要只把图纸上的尺寸全部相加。"},{"title":"极值法适合保证边界","text":"线性独立尺寸链的最不利上下限可按代数关系计算。RSS 需要统计分布、相关性与过程能力等前提，不能把公差半宽直接当标准差后声称概率保证。"},{"title":"设计可以缩短链","text":"共同基准、局部定位、调整垫片、长圆孔或浮动结构可以改变误差传递。调整自由度不能牺牲必须保持的定位功能，需要明确锁紧后的状态。"}],"formula":"C=A−B：Cmin=Amin−Bmax，Cmax=Amax−Bmin。多环线性最坏半宽为各贡献绝对值之和。","example":"A=20±0.10 mm，B=19.7±0.10 mm，则 C=0.10～0.50 mm。若要求 C≥0.20 mm，名义间隙 0.30 看似足够，但最坏情况不满足。","pitfalls":["统计方法不是免费放宽公差的理由。","需要考虑温差、涂层、装配压缩与方向。"],"practice":"把上例 A 的公差改为 ±0.05、B 改为 ±0.05，自己算出新范围并核对实验。","quiz":{"q":"名义间隙合格是否代表所有允许尺寸组合都合格？","options":["是","否，需要检查边界组合","只要平均值正确"],"answer":1,"why":"功能常由最不利组合而非名义值决定。"},"links":["fits","datums","sheet","case-enclosure"],"sources":["T10","T11"],"visual":"stack","level":"基础","table":null},{"id":"gdt","module":"precision","title":"几何公差：形状、方向、位置与基准","goal":"理解“孔径合格但装不上”的另一半原因。","core":[{"title":"公差带控制对象不同","text":"平面度控制一个面的形状，本身不需要基准；平行度、垂直度控制相对于基准的方向；位置度控制特征相对理论位置的偏离。圆跳动、全跳动是在转动测量条件下的综合变化，不能直接当孔径公差。"},{"title":"基准有顺序","text":"A、B、C 形成规定优先级的参考体系，应对应装配和测量功能。基准特征、理想基准和实际建立基准的方法需要区分；选一个方便画符号的面未必正确。"},{"title":"实体要求是进阶条件","text":"孔的最大实体尺寸为允许的最小孔径，轴相反。最大实体要求下，实际尺寸离开最大实体状态可在规定条件下增加几何公差；尺寸限制仍然存在，具体按所用标准与完整标注解释。"}],"formula":"对不倾斜的简化孔轴线位置，直径 0.10 的圆柱公差带对应中心径向偏差≤0.05，不是 X、Y 各±0.10。","example":"孔径 10.00～10.10 mm，位置度在最大实体状态为直径 0.10；当实际孔径 10.06 时，简单例中的总位置公差可为直径 0.16。此例不含基准移动或复合框格。","pitfalls":["位置度直径带不能当矩形 XY 范围。","ISO/GB 与 ASME 的默认规则存在差异，要按图纸规定体系。"],"practice":"在位置度图中移动孔中心，看“各轴误差不大”却可能超出圆形边界的情况。","quiz":{"q":"位置度直径 0.10 时，简化中心偏移半径上限？","options":["0.10","0.05","0.20 mm"],"answer":1,"why":"直径与半径差一倍，完整公差还包含方向和基准条件。"},"links":["fits","datums","metrology"],"sources":["T11","T12","T13"],"visual":"position","level":"基础","table":null},{"id":"metrology","module":"precision","title":"测量：卡尺读得出，不代表测得准","goal":"区分分辨率、误差、重复性与测量方法。","core":[{"title":"量具与被测特征匹配","text":"卡尺适合很多常规尺寸，不等于适合所有小公差；千分尺、百分表、塞规、环规、粗糙度仪和三坐标各有用途。几何公差需要基准建立与相应采样方法，不能只量一个距离。"},{"title":"环境和手法进入误差","text":"温度、测力、测头形状、清洁、对齐、变形和校准状态都会影响读数。显示位数不是准确度；重复读数接近也不代表没有系统偏差。"},{"title":"粗糙度与尺寸分开","text":"Ra 是轮廓偏差绝对值的平均类参数，不能完整描述表面纹理、方向和极端峰谷。轴承、密封、滑动和涂装对表面的要求不同；粗糙度、形状和波纹度不应混为一谈。"}],"formula":"热膨胀近似 ΔL=αLΔT；高精度测量要定义温度条件、稳定时间和测量不确定度。","example":"教学例：100 mm 铝件取 α≈23×10⁻⁶/K，温差 20 K，长度变化约 0.046 mm。若讨论 0.01 mm 级要求，温度可能已不可忽略。","pitfalls":["“三坐标测过”也要说明基准、点位、算法与设备能力。","测量重复性不等于工件批量一致性。"],"practice":"在同一静止物体上重复测三次，记录测量方向和手法；仅用于理解重复性，不把普通尺的读数当精密结论。","quiz":{"q":"显示 0.001 mm 的量具一定有 0.001 mm 准确度吗？","options":["一定","不一定","永远无法测量"],"answer":1,"why":"分辨率与测量误差、不确定度是不同概念。"},"links":["gdt","thermal","test-plan"],"sources":["N27","T11"],"visual":"metrology","level":"基础","table":null},{"id":"datums","module":"precision","title":"定位与装配基准：3-2-1 为什么有效","goal":"让定位、夹紧和误差释放各自有职责。","core":[{"title":"限制六个自由度","text":"典型 3-2-1 定位用主平面、次方向和第三方向逐步限制刚体自由度。具体接触、间隙和夹紧力需符合实际工件，不能只是图上点了六个点。"},{"title":"定位与夹紧分工","text":"定位提供位置关系，夹紧使接触保持。靠螺钉间隙孔不一定能重复精确定位；止口、销、基准面可承担定位。夹紧力若使薄壁变形，松开后尺寸会变化。"},{"title":"避免把误差锁死","text":"两个圆销同时精确约束多个方向可能造成过约束，某些方案采用圆销配菱形销或允许方向浮动。功能关键方向必须保留约束，热膨胀和制造误差在非关键方向释放。"}],"formula":"定位策略 = 必须约束的自由度 + 允许浮动的方向 + 保持接触的夹紧力。","example":"教学相机座：底面控制姿态，止口或定位销控制平面位置，螺钉提供夹紧。更换相机后是否能重复定位，需要实测装拆循环，而不是只看一次 CAD 对齐。","pitfalls":["多加定位销不必然提高精度。","加工基准、设计基准、装配基准不一致时要分析转换误差。"],"practice":"把一本书放桌上，再用侧面和端面挡块定位，观察每新增一组接触限制哪些运动。","quiz":{"q":"定位与夹紧为什么要分开考虑？","options":["一个定义位置，一个维持接触","两者毫无关系","夹紧越大越精确"],"answer":0,"why":"合理分工可避免变形与过约束。"},"links":["dof","stack","cnc"],"sources":["T2","T11"],"visual":"datum","level":"基础","table":null},{"id":"cnc","module":"manufacturing","title":"CNC：刀具能不能到，零件能不能夹","goal":"从加工运动理解内角、深腔与精度成本。","core":[{"title":"车削与铣削","text":"车削通常由工件旋转配合刀具进给，适合许多回转面；铣削由旋转刀具切削，适合平面、槽和型腔等。多轴改变可达性与装夹需求，不代表自动拥有任意精度。"},{"title":"刀具半径进入几何","text":"普通旋转铣刀不能直接做出无限尖的内角；深窄腔需要细长刀，刚度低、排屑困难。适当放大内圆角、减少深腔比和统一刀具规格，有助加工稳定与成本。"},{"title":"夹紧和基准进入结果","text":"薄壁可能在夹紧时变形，松开后回弹；多次装夹会引入基准转换误差。关键位置关系尽可能在合理工序内保证，精度要求要能测。"}],"formula":"切削速度 vc=πDn/1000（D:mm，n:r/min，vc:m/min）；进给速度 vf=fz·z·n。切削参数须按刀具、材料和工况选。","example":"相机支架内腔设计 R0.2，而可用刀具直径为 6 mm。普通该刀的内角能力受约 R3 限制；可改几何、换刀与工序或讨论 EDM，不能只在图纸上坚持尖角。","pitfalls":["CNC 不是一种固定精度数值。","孔深、螺纹深与钻尖空间不同，盲孔要给加工余量。"],"practice":"在刀具实验调刀半径，观察刀具中心路径与留下的内圆角；思考配合件能否相应倒角避让。","quiz":{"q":"深窄腔为何往往更贵？","options":["细长刀刚度、排屑和多工序问题","铝一定不能铣","图纸颜色多"],"answer":0,"why":"加工成本来自可达性、稳定性、时间与检验等。"},"links":["datums","material-selection","dfma"],"sources":["T16","N20"],"visual":"cnc","level":"基础","table":null},{"id":"sheet","module":"manufacturing","title":"钣金：展开、折弯、回弹与避让","goal":"让一张平板最终成为可装配的壳体。","core":[{"title":"从工艺顺序理解几何","text":"下料与孔槽加工后，再折弯、连接和表面处理。折弯时内侧压缩、外侧拉伸，中性层位置影响展开长度；实际展开应结合材料、板厚、模具和工厂试片/经验校准。"},{"title":"内 R 与板厚不独立","text":"最小内半径受材料、状态、纹向、板厚与模具影响。孔太靠近折弯区可能变形，短边可能夹不住，复杂折弯顺序可能撞刀。设计圆角不一定等于实物成形内 R。"},{"title":"回弹与装配","text":"卸载后发生弹性回弹，角度与尺寸可能变化。折边高度、公差链、接缝、铆螺母和螺钉工具空间要一起检查，不能只保证展开图好看。"}],"formula":"折弯展开的简化弯曲余量 BA=θ(R+Kt)，θ 用弧度；K 是中性层系数，须经工艺依据确定。","example":"教学取 t=2 mm、R=2 mm、θ=90°、K=0.4，则 BA≈4.40 mm。该数值仅说明公式，不是对任意 2 mm 镀锌板下料的通用指令。","pitfalls":["R0.5 与 t=2 mm 是否可行不能脱离材料和加工条件判断。","“镀锌板强度低”无法替代钢基材牌号和状态。"],"practice":"用纸折盒子，预先标出折弯顺序与避让缺口；体验有些边即使 CAD 无干涉，工具也到不了。","quiz":{"q":"展开长度为什么不能只用内外边长直接相加？","options":["弯曲时中性层与弧长影响展开","纸的颜色不同","板厚永远为零"],"answer":0,"why":"需要弯曲余量及工艺校准。"},"links":["surface","stack","alloys"],"sources":["T22","T23"],"visual":"bend","level":"基础","table":null},{"id":"injection","module":"manufacturing","title":"注塑：壁厚、拔模、筋柱与分型","goal":"从充填、冷却和脱模看塑料外壳。","core":[{"title":"成形循环","text":"塑料经塑化进入模腔，经历充填、保压、冷却、开模与顶出。材料、温度、压力与几何影响缩痕、翘曲、短射和熔接线；复杂缺陷常要模流、试模与测量共同判断。"},{"title":"均匀壁厚与有效加筋","text":"厚区冷却和收缩不同，可能产生缩痕与内部缺陷。局部挖空、平缓过渡、筋和支撑常优于直接堆厚。筋厚比例是设计起点，具体随材料与外观要求确定，不能背一个通用数值。"},{"title":"开模方向决定可制造性","text":"拔模帮助脱模；倒扣可能需要滑块、斜顶或改变拆分。分型线、浇口、顶针和熔接线应避开关键功能或外观区域，螺柱需要考虑根部厚肉、底孔与装配扭矩。"}],"formula":"设计顺序：材料与批量 → 分型/脱模方向 → 壁厚与筋 → 浇口/流动 → 收缩与关键尺寸 → 试模验证。","example":"教学外壳：把螺柱直接做成厚实圆柱，外表面可能缩痕。改成中空柱、合理筋和圆角，并匹配螺钉与底孔；同时检查模具能否脱模。","pitfalls":["材料收缩率不是一个适用于所有方向和所有工艺的固定尺寸补偿。","螺柱裂纹可能同时与材料、成形和装配有关。"],"practice":"播放注塑循环，暂停在冷却阶段；比较厚区与薄区为什么不能同时按相同比例冷却。","quiz":{"q":"注塑壳增刚优先考虑什么？","options":["无限加厚","合理截面、筋与支撑，并保持壁厚过渡","只提高喷漆厚度"],"answer":1,"why":"局部厚肉带来收缩、冷却和外观问题。"},"links":["polymers","bolts","case-enclosure"],"sources":["T17","T18"],"visual":"molding","level":"基础","table":null},{"id":"casting","module":"manufacturing","title":"铸造、压铸、锻造与挤压","goal":"从毛坯路线决定形状与批量成本。","core":[{"title":"金属液成形","text":"普通铸造与高压压铸的充型、模具、批量与材料范围不同。压铸能以模具形成复杂近净形状，但需考虑脱模、均匀壁厚、流动、排气、缩孔与气孔。关键配合面常需后加工。"},{"title":"固态塑性成形","text":"锻造通过塑性变形形成毛坯，组织流线、缺陷与热处理影响性能；挤压适合长方向截面基本恒定的型材。每种工艺都有限制，不能只按“强度更高”“更便宜”一票决定。"},{"title":"模具摊销与修改代价","text":"少量样机的 CNC 可能成本更低、修改更快；批量增加后模具路线可能合适，但模具费用、良率、后加工和验证要一起比较。产品需求不稳定时开模的迭代成本也要计算。"}],"formula":"简化总成本 C=N·单件变动成本+一次性工装费用；实际还包括报废、质检、后加工、维护与库存。","example":"机器人关节壳从 CNC 改压铸：重新做壁厚、拔模、排气和轴承孔加工基准，验证气孔对密封和强度的影响；不能直接把原 CAD 改一个工艺名称。","pitfalls":["6061 常见机加工料不等于它就是压铸首选。","铸造件外观完整不代表内部没有缺陷。"],"practice":"观察铝型材截面与压铸壳的分型痕迹，对比两种工艺能形成的几何。","quiz":{"q":"压铸件轴承孔是否一定无需后加工？","options":["一定","不一定，取决于精度、表面与工艺能力","一定不能有孔"],"answer":1,"why":"关键配合需要最终加工与测量能力保证。"},"links":["alloys","dfma","fits"],"sources":["T19","T20","N6"],"visual":"casting","level":"基础","table":null},{"id":"joining","module":"manufacturing","title":"焊接、铆接、胶接与可拆连接","goal":"连接不仅决定强度，也决定变形与维修。","core":[{"title":"焊接带来局部热循环","text":"熔化焊可能产生残余应力、变形、热影响区和缺陷；材料、接头形式、坡口、焊接顺序与夹具共同影响结果。薄板与热处理铝件尤其要考虑变形和性能变化。"},{"title":"机械连接与胶接","text":"螺栓方便维护但增加孔与装配工时；铆接适合部分薄板连接但拆卸代价不同；胶接可分布载荷与密封，却依赖表面、固化和环境。混合连接要考虑载荷实际如何分担。"},{"title":"连接位置决定载荷路径","text":"避免把关键接头放在最大弯矩与应力集中叠加处。给焊枪、铆枪、扳手与检验留空间。焊后机加工基准与表面处理次序要一起规划。"}],"formula":"接头评估包含：载荷方向、局部应力、疲劳、制造变形、检验与可维修性。","example":"教学薄板框架焊后歪斜：优化焊接顺序、热输入、夹具和结构，而非只加厚所有板。若精密孔位重要，可在焊后再加工并建立合适基准。","pitfalls":["胶接的搭接剪切试验值不等于任何剥离工况许用值。","焊缝画得更大不一定降低整个结构的残余变形。"],"practice":"比较自行车架焊缝和家电铆接位置，思考维修时需要哪些工具与接近方向。","quiz":{"q":"6061-T6 焊接设计为什么要考虑热影响区？","options":["局部强化状态可能改变","颜色会决定刚度","焊接不产生热"],"answer":0,"why":"热循环会影响材料与接头性能。"},"links":["surface","fatigue","dfma"],"sources":["T3","T2"],"visual":"joining","level":"基础","table":null},{"id":"additive","module":"manufacturing","title":"3D 打印：方向、支撑、层间与用途","goal":"让打印样件回答合适的问题。","core":[{"title":"工艺家族不同","text":"FDM/FFF 熔融挤出逐层堆积；SLA 等光固化用树脂成形；SLS 等粉末工艺有不同的支撑、表面和材料特征；金属增材还涉及热处理、残余应力与后加工。不能只说“3D 打印强度”。"},{"title":"方向影响结果","text":"FDM 层间结合、路径、壳数、填充、温度和环境影响性能。打印姿态还决定支撑痕迹、孔质量和尺寸偏差。光固化材料也有配方、后固化、温度与老化条件。"},{"title":"样件用途决定验收","text":"外形与装配验证、功能承载件、工装治具需要不同标准。打印件可帮助验证接口，但不能自动证明注塑、CNC 或量产材料的强度和寿命。"}],"formula":"打印件验证记录至少包含：工艺、材料牌号、姿态、关键参数、后处理与测试条件。","example":"教学卡扣：平放打印能弯，竖放打印在层间断裂。应改变朝向与几何，必要时换工艺；不能只把填充率调为 100% 就认为问题解决。","pitfalls":["一张照片不能识别内部孔隙与层间质量。","注塑件验证不能直接由外形相同的 PLA 样件替代。"],"practice":"观察打印件层纹，沿不同方向轻轻比较薄试样的变形，勿使用承载中的真实零件做破坏试验。","quiz":{"q":"打印姿态为什么需要记录？","options":["影响表面、尺寸和力学方向性","仅用于摆拍","不会影响任何结果"],"answer":0,"why":"工艺参数是性能证据的一部分。"},"links":["polymers","material-selection","test-plan"],"sources":["T21","N3"],"visual":"layers","level":"基础","table":null},{"id":"precision-process","module":"manufacturing","title":"磨削、铰孔、研磨与 EDM","goal":"当普通铣削不合适时，知道可以问谁。","core":[{"title":"精加工不只有小刀慢走","text":"磨削可用于部分硬材料与精密表面，但热损伤、残余应力和烧伤需控制；铰孔改善特定孔的尺寸与表面，不能无条件修正很大的位置误差；研磨/珩磨等用于相应表面要求。"},{"title":"电火花有自己的边界","text":"EDM 依靠放电去除导电材料，适用于一些难切形状和硬材料；有加工效率、表层影响、电极与后处理代价。不是所有材料和内角都能零成本解决。"},{"title":"按特征分配工艺","text":"关键孔、定位面、密封面分别定义功能、粗糙度、尺寸与几何要求。让供应商反馈路线和测量方法，避免整件统一标成最高精度。"}],"formula":"工艺选择看：材料状态 + 几何可达性 + 尺寸/几何/表面要求 + 批量与检测能力。","example":"教学零件：大外形公差较宽，只有轴承孔与安装面需要精确关系。可采用粗加工后建立稳定基准，再精加工关键特征，以减少无效成本。","pitfalls":["铰孔不自动保证孔位置度。","“能做出来”与“可稳定批量交付”不同。"],"practice":"在一张零件草图上只圈出三个真正需要精加工的表面，并说明它们的功能。","quiz":{"q":"为什么不把所有尺寸都标最紧？","options":["增加成本与检验负担，且未必有功能收益","紧公差没有任何用途","机器只认整数"],"answer":0,"why":"精度应服务功能并可稳定检验。"},"links":["gdt","metrology","dfma"],"sources":["T16","N20"],"visual":"cnc","level":"基础","table":null},{"id":"layout","module":"integration","title":"整机布局：空间、质量、重心与维修","goal":"从漂亮装配体走向可工作的机器。","core":[{"title":"先划功能和接口","text":"明确承载框架、驱动、感知、电池、电控与外罩的关系；标出运动包络、连接器插拔、线缆和工具空间。外壳不一定负责全部定位和承载，功能分层会影响后期修改。"},{"title":"质量放在哪里很重要","text":"相同总质量，放在远离转轴处会增加惯量；底盘重心高度影响倾覆稳定性。重量预算应逐步从估计更新为实际 BOM 与称量。"},{"title":"用维修动作验证结构","text":"电池、易损轮和传感器能否单独拆换，是否需要先拆大量不相关零件，防呆与防错是否清晰。装配路径和测试点也属于设计要求。"}],"formula":"集中质量近似 J=Σmr²；整体重心 r重心=Σmr/Σm。真实 CAD 惯量需核对材料与坐标系。","example":"教学机械臂：把同样 200 g 的驱动板从末端移近关节，可明显降低该轴惯量，但需要检查新增线缆、热和接口。减重不是只在支架上打孔。","pitfalls":["CAD 默认密度可能错误，模型质量不等于实物称重。","静态不干涉不等于全行程、线束和工具都不干涉。"],"practice":"在家用吸尘器或小车照片上标出重物、易损件、手握点与维修路径。","quiz":{"q":"同样质量移离转轴更远，会怎样？","options":["惯量通常增大","惯量不变","质量消失"],"answer":0,"why":"点质量对惯量的贡献与距离平方有关。"},"links":["motor-sizing","cabling","cad"],"sources":["T2","T14"],"visual":"robot","level":"基础","table":null},{"id":"thermal","module":"integration","title":"散热：热源到环境的一整条路","goal":"不要只记铜导热好、加风扇能降温。","core":[{"title":"热从哪里产生","text":"电机铜耗、铁耗与摩擦、驱动器开关/导通损耗、电池与计算模块等都是热源。首先明确连续与峰值工况，热容可延缓升温，但不能消除稳态热负荷。"},{"title":"导热、接触与对流串起来","text":"热经过材料、接触界面、壳体，再通过对流与辐射到环境。导热片若没有压紧或散热出口，只换成铜可能效果有限；表面涂层、防水壳和线束也会改变热路。"},{"title":"测量应对应关键温度","text":"外壳温度不是绕组或芯片结温，热阻与测量点不同。使用热电偶、内置传感或热像时要考虑接触与发射率等误差，测试环境和姿态应与要求一致。"}],"formula":"稳态简化 ΔT=P损耗·Rθ；导热 R=L/(kA)；对流近似 R=1/(hA)。真实系统可能有并联路径与温度相关参数。","example":"假设损耗 10 W、总热阻 4 K/W、环境 25℃，节点稳态估计 65℃。若界面贡献 2 K/W，改善外部风速而不处理接触瓶颈，收益可能受限。","pitfalls":["手能感觉到风不等于已经证明关键器件温度合格。","导热率高与比热容大是不同属性。"],"practice":"在热路实验调接触热阻和环境散热热阻，观察温度；先找哪一段占总热阻最多。","quiz":{"q":"热容增大能否自动降低相同热阻下的最终稳态温升？","options":["能","不能，只影响升温过程等动态","会消灭损耗"],"answer":1,"why":"稳态温升由热负荷与总散热路径决定。"},"links":["materials-metrics","motor-sizing","test-plan"],"sources":["T28","T3"],"visual":"heat","level":"基础","table":null},{"id":"cabling","module":"integration","title":"线束：运动中的“软零件”","goal":"把弯曲、扭转、拉力和干涉纳入模型。","core":[{"title":"静态可塞下不代表能运动","text":"旋转和往复时检查最小动态弯曲半径、扭转、摩擦、夹点和拉伸。留服务余量，但太长又可能缠绕。动态额定与静态安装要求不同，遵循具体线缆规格。"},{"title":"固定与应力释放","text":"连接器不能长期承受线束重量和运动拉力；在合适位置夹持、应力释放、避开锐边，给装拆与维护留余量。线束跨关节的位置会改变疲劳和阻力矩。"},{"title":"机电共同检查","text":"动力线与敏感信号线的布置、屏蔽接地、连接器防呆和防水需与电气同事协同。通信偶发错误可能与振动、松脱、压降或干扰有关。"}],"formula":"线束验证 = 全行程包络 + 最小弯曲半径 + 拉扭限制 + 循环寿命 + 插拔/防护条件。","example":"教学关节：空载走位正常，装上线束后电流在某角度升高。查看是否线束拉紧、擦壳或扭转积累，而不是只提高电流限制。","pitfalls":["某条拖链电缆的弯曲倍数不能用于所有电缆。","电线可以弯曲，不代表无限次折弯不会坏。"],"practice":"用绳子代替线束，在纸板关节模型上走完整行程，标出最紧和最容易夹住的位置。","quiz":{"q":"连接器附近为什么做应力释放？","options":["减少拉扭载荷直接传到端子","让电流变小到零","为了隐藏电线"],"answer":0,"why":"机械载荷会影响电连接可靠性。"},"links":["power-bus","layout","failure"],"sources":["T27"],"visual":"wiring","level":"基础","table":null},{"id":"mobility","module":"integration","title":"移动与足式：地面反力、抓地与稳定","goal":"不把机器人理解成悬空的机构。","core":[{"title":"轮式驱动需要抓地","text":"牵引需求包括加速、坡度和阻力，轮端转矩由轮半径转换。驱动力还受轮地摩擦和驱动轮法向载荷限制；电机转矩足够但轮胎打滑时，不能靠继续加电流解决。"},{"title":"静态稳定有适用范围","text":"静态近似下，重心投影相对支撑区域影响倾覆。转弯、加减速、足式动态与接触切换时需要动态分析，不能只凭静态重心投影保证所有动作。"},{"title":"腿式把接触力映射到关节","text":"姿态影响地面反力的力臂与关节需求，腿完全伸直、脚位置和地形会改变可控性与受力。结构和运控应一起确定极限姿态、冲击与保护策略。"}],"formula":"轮式简化 F≈ma+mg sinθ+Crr·mg cosθ；每个等分驱动轮 T≈Fr/Nd；抓地上限取决于 μ·驱动轮法向载荷。","example":"教学小车上坡：换大轮有助跨越某些障碍，但同样牵引力需要更大轮端转矩；也会改变底盘高度、重心和减速比需求。用综合实验同时观察这些变化。","pitfalls":["滚阻系数与滑动摩擦系数不是一个参数。","Nd 等分只适用于对应分配假设，不代表真实轮载永远相等。"],"practice":"拿小车模型在水平桌面观察驱动轮与支撑轮布局，想象电池前移如何改变轮载。","quiz":{"q":"电机转矩足够却打滑，优先考虑什么？","options":["抓地与法向载荷","无限提高电流","把编码器拆掉"],"answer":0,"why":"可传到地面的力受接触条件限制。"},"links":["loads","motor-sizing","robot-kinematics","case-chassis"],"sources":["N18","N23"],"visual":"system","level":"基础","table":null},{"id":"grippers","module":"integration","title":"夹爪与吸附：夹得住还要不伤工件","goal":"把摩擦、真空、力矩和表面条件放在一起。","core":[{"title":"平行夹爪的力不等于承载重量","text":"要看指端摩擦、接触面积、偏心、加速度、工件强度与夹持方向。电机或气缸推力经过机构后才成为指端力，机构机械优势随姿态可能变化。"},{"title":"真空由压差产生吸力","text":"理想法向吸力为压差乘有效面积，实际受泄漏、表面粗糙、曲率、变形、偏心剥离和动态影响。竖直墙面主要还要克服沿壁滑动与倾覆力矩；有吸力不等于能够爬墙。"},{"title":"失效时怎样保持","text":"物体脱落风险、失压、断电、真空储备、机械止挡与检测需要根据用途评估。教学推算只能帮助理解量级，不能作为实物高处吸附验证。"}],"formula":"理想 F真空=Δp·A；简单双指摩擦夹持 2μN≥mg（对称、静态等假设），动态与偏心需另算。","example":"直径 40 mm 吸盘、压差 50 kPa，理想法向力约 62.8 N。若放在竖直墙上，不能直接说能挂 6.4 kg：还缺摩擦、剥离力矩、漏气和可靠性条件。","pitfalls":["真空表读数不能单独证明密封与所有方向承载。","夹持力太大可能压伤薄壁工件。"],"practice":"用纸画出吸盘受力，分别标墙面法向、重力和偏心力矩；先不做真实悬挂实验。","quiz":{"q":"为什么竖直吸盘不能只按 ΔpA 换算重量？","options":["还要检查切向摩擦、偏心与泄漏","压差与力毫无关系","面积越大一定越危险"],"answer":0,"why":"吸力方向与重力方向不同，还存在失效模式。"},"links":["fluid-actuators","loads","seals","case-suction"],"sources":["N16","N17","N24"],"visual":"pneumatic","level":"基础","table":null},{"id":"fea","module":"validation","title":"有限元：模型能回答什么，不能回答什么","goal":"把云图变成可审查的工程证据。","core":[{"title":"先确定问题类型","text":"静力分析看给定载荷下应力与变形；模态看固有频率与振型；瞬态看时变响应；热、接触、非线性和疲劳各有相应模型。选择方便的软件模块不等于选择了正确物理。"},{"title":"边界条件决定结果","text":"材料状态、载荷分布、支撑刚度、连接预紧、接触与摩擦、几何简化都影响结果。把所有接触绑死、所有安装面固定，容易虚增刚度。先用手算校核数量级与反力平衡。"},{"title":"收敛也要看对指标","text":"检查关键位移、应力区域和反力对网格的稳定性。尖角、点载荷和理想固定边可能产生奇异性，最大应力随细化增大；应辨别真实几何与接触，不能机械取最大值也不能随意忽略。"}],"formula":"模型审查：单位 → 材料 → 载荷 → 约束 → 接触 → 网格 → 平衡与收敛 → 实测对照。","example":"教学支架：手算挠度约 0.46 mm，FEA 却只有 0.002 mm。先查单位、固定范围与接触，而不是宣布优化成功。实物加载验证仍不可省。","pitfalls":["求解完成只表示数学过程结束，不是设计通过。","任意彩色红区不等于必定断裂。"],"practice":"看一张仿真云图，尝试找出单位、变形缩放、载荷、约束和材料；缺的项目就是审查问题。","quiz":{"q":"网格越细最大应力越大时应怎样？","options":["先检查奇异性、几何和载荷/约束建模","永远取最大值","直接删掉红区"],"answer":0,"why":"需要判断指标的物理意义与收敛性。"},"links":["beam","gdt","test-plan"],"sources":["T29","T1"],"visual":"fea","level":"基础","table":null},{"id":"vibration","module":"validation","title":"振动：固有频率、阻尼与激励","goal":"理解为什么某个转速附近突然很吵。","core":[{"title":"系统自身有动态特征","text":"质量与刚度决定固有频率，阻尼影响衰减与共振峰。真实结构是多自由度系统，每个模态有不同振型，某位置的激励不一定同样激发所有模态。"},{"title":"激励频率来自哪里","text":"转动不平衡、齿轮啮合、步进脉动、地面与控制动作都可激励结构。接近某模态频率时响应可能放大，幅度还取决于激励方向、位置与阻尼。"},{"title":"隔振与加固各有条件","text":"加刚或减重会改变模态；加阻尼会耗能；隔振让设备相对基础可动，可能引入低频共振。不是所有频率下软垫都能减振，需看频率比和功能位移限制。"}],"formula":"m x¨+c x˙+kx=F(t)；fn=(1/2π)√(k/m)，ζ=c/(2√km)。","example":"教学系统 m=1 kg，k=400 N/m，fn≈3.18 Hz。若质量加倍且刚度不变，fn 降为约 2.25 Hz；原来的工作转速可能更接近共振。","pitfalls":["模态分析一般不直接给出真实工作振幅。","一个低固有频率是否坏，要看工作激励与允许响应。"],"practice":"在实验中扫激励频率，比较不同阻尼下的响应；峰值附近的图示是简化稳态模型。","quiz":{"q":"同刚度质量加倍，单自由度 fn 如何变？","options":["变为 1/√2","翻倍","不变"],"answer":0,"why":"fn 与质量平方根成反比。"},"links":["springs","control-mechanics","fea"],"sources":["T30"],"visual":"vibration","level":"基础","table":null},{"id":"test-plan","module":"validation","title":"验证计划：先写怎样判失败","goal":"让样机试验回答明确问题。","core":[{"title":"需求对应测试","text":"每个需求给出工况、样本、设备、测量点、阈值、数据处理和终止条件。把静载、刚度、温升、轨迹、装拆、寿命和环境验证区分，避免一次展示覆盖所有结论。"},{"title":"控制变量与对照","text":"比较设计版本时尽可能固定其他条件；记录温度、负载、姿态、软件和装配状态。变化多且原因不明时，采用系统性的试验设计思路而非一次全改。"},{"title":"从原始数据到结论","text":"先保存原始记录与异常，不仅留“成功”截图。报告测量误差、重复性、样本限制与未覆盖工况；失效后定位原因，修正后重复有关测试并检查受影响需求。"}],"formula":"一条测试记录：版本 / 样本 / 工况 / 仪器 / 观测 / 判据 / 结果 / 异常与后续。","example":"教学电机温升测试：定义环境、工作周期、负载、温度测点和稳定判据，记录电流与温度曲线；外壳没烫手不是合格判据。","pitfalls":["样本少时不能给出没有证据的批量可靠度。","没有测量条件的“精度 ±0.01”不完整。"],"practice":"给手机支架写一张非破坏静载验证卡，包含允许位移与测量方式，不做跌落或高风险实验。","quiz":{"q":"最有用的测试结果是什么？","options":["成功一次的视频","明确版本、工况、判据与原始数据","一句“感觉不错”"],"answer":1,"why":"可重复和可追溯是证据的基础。"},"links":["design-loop","thermal","failure"],"sources":["R2","T29"],"visual":"test","level":"基础","table":null},{"id":"failure","module":"validation","title":"排故与质量：先找证据，再改设计","goal":"处理异响、卡滞、发热、松动和装配不良。","core":[{"title":"把现象说具体","text":"什么时候出现、在哪个位置、与速度/温度/方向是否有关、能否重复。先保留样件和数据，区分电气、控制、机械与制造原因，不用一个笼统“电机不行”终止分析。"},{"title":"建立可证伪的假设","text":"例如卡滞可能来自不同轴、过紧配合、线束拉扯、导轨预紧或异物；为每个假设安排一个能区分原因的检查。避免同时换五个零件后不知道谁起作用。"},{"title":"从单件走向过程","text":"均值、分散、过程能力和测量系统共同决定量产表现。Cp/Cpk 等统计指标依赖稳定过程和合理分布/测量前提；不能用几个理想样件算出数字就保证良率。"}],"formula":"故障闭环：复现 → 量化 → 假设 → 分离变量 → 证据定位 → 修改 → 回归与预防。","example":"教学故障：转一圈某角度电流升高。先断电检查自由转动和线束，再查同轴度与负载，再对照控制日志。机械卡点和电气换相错误可能表现相似，需要区分证据。","pitfalls":["五个“为什么”不是免证据的猜测链。","返修成功不能自动说明原设计已经适合批量。"],"practice":"用站内案例选择一个故障，写出两个不同原因和各自的区分测试。","quiz":{"q":"同时修改很多变量的主要问题？","options":["难以建立因果关系","一定节省时间","一定保证成功"],"answer":0,"why":"排故应尽可能进行可区分的对照。"},"links":["metrology","bom","risk","case-enclosure"],"sources":["R2","N22"],"visual":"test","level":"基础","table":null},{"id":"cad","module":"delivery","title":"CAD 与工程图：把设计意图交给别人","goal":"让模型可修改，让图纸可制造、可检验。","core":[{"title":"参数化需要稳定关系","text":"草图约束、主基准、特征顺序与装配引用应反映设计逻辑。不要只让今天的模型不报错，还要检查尺寸修改后关键关系是否保留。大型装配可用合理子装配和配置。"},{"title":"工程图补足模型没有说的话","text":"视图、剖视与局部放大解释几何；关键尺寸、基准、公差、材料状态、表面、热处理、去毛刺、技术要求和版本使零件可交付。不要默认工厂从模型里猜功能。"},{"title":"出图之前做可用性检查","text":"确认干涉、工具与装配路径、运动包络、物料和尺寸一致。公差应该能被测量；参考尺寸与控制尺寸要清晰，避免同一要求重复约束。"}],"formula":"合格输出：几何 + 材料状态 + 功能尺寸/公差 + 工艺要求 + 可追溯版本。","example":"教学支架：模型孔径 6 mm，图纸写 M6 螺纹时需明确是螺纹还是通孔并正确表示深度；装配螺钉外径不能直接当间隙通孔直径。","pitfalls":["会点软件命令不等于能表达设计意图。","装配干涉检查不自动覆盖柔性线束与真实公差。"],"practice":"挑一个普通零件，用三视图和一个剖面说明内部结构；检查别人能否不打开模型也理解关键功能。","quiz":{"q":"工程图为何仍然重要？","options":["表达材料、功能公差、工艺和版本等交付条件","只是为了占页数","模型永远没有尺寸"],"answer":0,"why":"它让制造与检验有共同依据。"},"links":["gdt","datums","bom"],"sources":["T14","T15"],"visual":"drawing","level":"基础","table":null},{"id":"bom","module":"delivery","title":"BOM 与变更：让模型、图纸和实物同版","goal":"知道工程变更会影响哪些人和零件。","core":[{"title":"BOM 是结构化物料关系","text":"记录物料号、名称、规格、材料/采购要求、数量、版本和层级。外购电机、标准件、自制件与线束都应有可识别项，不能只用“螺丝若干”。"},{"title":"变更要评估关联","text":"改孔距可能影响壳体、支架、线束、治具和测试；改材料可能影响尺寸、热、重量和工艺。版本记录说明原因、影响范围、旧件处理与验证依据。"},{"title":"标准化要保留差异","text":"统一螺钉规格和通用接口可减少工具、库存与错误，但不应为统一而牺牲承载或防护。明确通用件与变体，避免复制粘贴后产生多个真相。"}],"formula":"配置一致性：CAD 版本 ↔ 图纸版本 ↔ BOM ↔ 采购/工艺 ↔ 实物标识 ↔ 测试记录。","example":"教学变更：电机供应商更换同功率型号，仍需检查孔位、轴长、编码器接口、转矩曲线、惯量与散热，不仅改 BOM 名称。","pitfalls":["最新版文件名不等于所有人都在同一版本。","“等效替代”需要功能与接口证据。"],"practice":"为一个三零件支架写 BOM，再假设更换螺钉长度，列出需要同步检查的图纸与装配项。","quiz":{"q":"替换同功率电机是否可直接不验证？","options":["可以","不可以，接口与动态能力可能不同","只看外观"],"answer":1,"why":"功率相同不代表规格和性能等价。"},"links":["motor-sizing","cad","test-plan"],"sources":["T15"],"visual":"flow","level":"基础","table":null},{"id":"dfma","module":"delivery","title":"DFM / DFA 与成本：设计要能稳定做出来","goal":"理解加工、装配、质检与维修的共同代价。","core":[{"title":"DFM 与 DFA","text":"DFM 关注制造路线、特征、工艺能力、良率和成本；DFA 关注零件数量、拿取、方向、防呆、工具接近与装配顺序。二者需要同时考虑，拆成更少零件不一定降低总成本。"},{"title":"成本不只是材料单价","text":"毛坯利用率、加工时间、装夹、模具、热处理、表面、质检、报废和返修都可能主导成本。小批与量产的最优方案可能不同，供应商报价需要相同边界比较。"},{"title":"优化需要同条件对比","text":"记录改前改后的数量、工艺、功能、质量与交付范围。把简化几何、统一标准件、放宽非关键公差与缩短装配动作变成可测收益。"}],"formula":"教学盈亏平衡：若 A 固定费 FA、单件 a，B 为 FB、b，则交点 N=(FB−FA)/(a−b)，要求分母与数量有实际意义。","example":"假设 CNC 每件 150 元、无模具费；模具路线固定 12000 元、每件 30 元，简化交点为 100 件。实际选择还要加入良率、修改、检验、交期和库存。","pitfalls":["示例价格是假设，不是当前市场报价。","把螺钉全部改胶接可能减少零件，却增加固化、返修与拆卸成本。"],"practice":"在一个家居产品上数装配方向和工具种类，尝试提出一个能缩短动作但不损害功能的修改。","quiz":{"q":"为什么同一个零件小批量与量产工艺可能不同？","options":["固定投入与单件成本的占比不同","工艺不影响成本","数量没有意义"],"answer":0,"why":"还要考虑需求稳定性和质量能力。"},"links":["casting","injection","cad"],"sources":["T16","T19","R2"],"visual":"cost","level":"基础","table":null},{"id":"risk","module":"delivery","title":"风险与技术表达：知道什么、还缺什么","goal":"把工程判断讲得具体且诚实。","core":[{"title":"从失效后果反推检查","text":"DFMEA 的基本思路是功能、失效模式、后果、原因、现有控制与改进行动。严重后果不能只被一个总分掩盖，应按组织方法优先处理；评价要有证据和责任人。"},{"title":"技术沟通采用同一条主线","text":"明确工况，指出主导原理，展示估算或测量，比较方案代价，给出验证方法和未确定项。初级岗位不需要假装每个工艺都量产过，但应知道如何获取可靠数据。"},{"title":"项目与学习成果分开","text":"本站算例与动画是教学模型，不是你的项目参数或实操经历。面试可用它解释“我现在理解的原理”，过去做过什么要按真实参与和证据表达。"}],"formula":"回答结构：条件 → 原理 → 估算/证据 → 取舍 → 验证与边界。","example":"“该项目使用现成电机，我负责机械适配。若重新选型，我会补负载周期、转矩转速和热校核；型号数据现在需要查原记录。”比临时编一个型号更可追问。","pitfalls":["不记得数值时区分能推导、能查表和未做过。","看过拆解不能表述成自己完成了该产品设计。"],"practice":"任选一课，用 60 秒解释一个真实物体；把你确认的事实与假设分别说出来。","quiz":{"q":"面对没实际做过的工艺，怎样回答更可靠？","options":["编一个项目","说明实践边界，再解释原理与验证路径","只说完全不会"],"answer":1,"why":"知识理解和实操经历可以分别表达。"},"links":["requirements","failure","design-loop"],"sources":["M1","M2","R4"],"visual":"flow","level":"基础","table":null}],"sources":{"M1":{"title":"禾赛机器人驱动岗面经，2026.08.07","url":"https://www.nowcoder.com/feed/main/detail/2602d44fe7524c0fa7e19b374b501e22?sourceSSR=subject","kind":"面经"},"M2":{"title":"小鹏机器人机械结构岗面经，2026.09.16","url":"https://www.nowcoder.com/feed/main/detail/5821a631b2504e37879953c5c4f87fcc?sourceSSR=subject","kind":"面经"},"M3":{"title":"拓竹机械结构岗面经，2026.07","url":"https://www.nowcoder.com/feed/main/detail/b0aca6dda96d4021bee39e684b102e03?sourceSSR=subject","kind":"面经"},"M4":{"title":"正浩结构工程师面经，2022","url":"https://www.nowcoder.com/discuss/395617217155551232","kind":"面经"},"T1":{"title":"MIT：悬臂梁挠度与刚度","url":"https://ocw.mit.edu/courses/2-002-mechanics-and-materials-ii-spring-2004/bc25a56b5a91ad29ca5c7419616686f7_lec2.pdf","kind":"教材 / 原厂"},"T2":{"title":"MIT：结构设计与刚度","url":"https://bpb-us-e1.wpmucdn.com/sites.mit.edu/dist/a/2056/files/FUNdaMENTALs-Topic-8-Structures.pdf","kind":"教材 / 原厂"},"T3":{"title":"Hydro：6061 合金及状态","url":"https://www.hydro.com/Document/Index?id=560718&name=Alloy+6061.pdf","kind":"教材 / 原厂"},"T4":{"title":"Modern Robotics：机器人自由度","url":"https://modernrobotics.northwestern.edu/nu-gm-book-resource/2-2-degrees-of-freedom-of-a-robot/","kind":"教材 / 原厂"},"T5":{"title":"东方马达：额定与瞬时转矩","url":"https://www.orientalmotor.co.in/in/products/brushless-motors/spec-guide","kind":"教材 / 原厂"},"T6":{"title":"maxon：电机计算与 RMS 转矩","url":"https://www.maxongroup.com/medias/sys_master/8802918268958.pdf?attachment=true","kind":"教材 / 原厂"},"T7":{"title":"Harmonic Drive：谐波减速原理","url":"https://www.harmonicdrive.net/technology/harmonicdrive","kind":"教材 / 原厂"},"T8":{"title":"NSK：额定载荷与疲劳寿命","url":"https://www.nsk.com/tools-resources/abc-bearings/dynamic-load-ratings-and-fatigue-life/","kind":"教材 / 原厂"},"T9":{"title":"SKF：轴承接口、配合与载荷条件","url":"https://cdn.skfmediahub.skf.com/api/public/0901d196802809de/pdf_preview_medium/Rolling_bearings_-_17000_1_EN_pdf_preview_medium.pdf","kind":"教材 / 原厂"},"T10":{"title":"米思米：尺寸公差及配合表","url":"https://www.misumi.com.cn/pdf/fa/2018/p2883.pdf","kind":"教材 / 原厂"},"T11":{"title":"KEYENCE：几何公差框格","url":"https://www.keyence.ca/ss/products/measure-sys/gd-and-t/basic/tolerance-entry-frame.jsp","kind":"教材 / 原厂"},"T12":{"title":"KEYENCE：位置度测量","url":"https://www.keyence.com/ss/products/measure-sys/gd-and-t/location-tolerance/position.jsp","kind":"教材 / 原厂"},"T13":{"title":"KEYENCE：最大实体要求","url":"https://www.keyence.com/ss/products/measure-sys/gd-and-t/advanced/ itions?newsarchivetagfilter=Turning","kind":"教材 / 原厂"},"N21":{"title":"NASA：好奇号车轮损伤照片与记录","url":"https://science.nasa.gov/photojournal/break-in-raised-tread-on-curiosity-wheel/","kind":"真实案例"},"N22":{"title":"NASA：地面车轮验证试验","url":"https://www.nasa.gov/image-article/testing-wheels-of-mars-curiosity-rover/","kind":"真实案例"},"N23":{"title":"NASA：毅力号车轮与悬架","url":"https://science.nasa.gov/mission/mars-2020-perseverance/rover-components/","kind":"真实案例"},"N24":{"title":"Parker：O 形圈设计手册","url":"https://www.parker.com/content/dam/Parker-com/Literature/Praedifa/Catalogs/Catalog_O-Ring-Handbook_PTD5705-EN.pdf","kind":"教材 / 原厂"},"N25":{"title":"MathWorks：PID 积分抗饱和","url":"https://uk.mathworks.com/help/simulink/slref/anti-windup-control-using-a-pid-controller.html","kind":"教材 / 原厂"},"N26":{"title":"MathWorks：微分与噪声","url":"https://uk.mathworks.com/videos/understanding-pid-control-part-3-expanding-beyond-a-simple-derivative-1531120808026.html","kind":"教材 / 原厂"},"N27":{"title":"Renishaw：分辨率、精度与重复性","url":"https://www.renishaw.com/en/how-to-optimise-your-encoder-system--47807","kind":"教材 / 原厂"},"N28":{"title":"TI：RS-485 物理层与协议","url":"https://www.ti.com/document-viewer/lit/html/SSZTCS4","kind":"教材 / 原厂"},"N29":{"title":"TI：CAN 与上层协议","url":"https://www.ti.com/document-viewer/lit/html/SSZTCR9/GUID-0FADB98A-563E-46D7-BB75-A561B79A5B30","kind":"教材 / 原厂"}},"cases":[{"id":"case-chassis","title":"一台小车，如何从重量算到电机？","tag":"跨模块设计 · 可调参数","intro":"教学任务：双驱动轮小车在坡面匀速/加速运行。把载荷、轮径、减速、电机和热放进同一条计算链。所有数值均为假设。","visual":"system","links":["loads","mobility","gears","motor-sizing","thermal","bearings"],"steps":[["定义边界","取整机 8 kg，速度 0.5 m/s，加速度 0.3 m/s²，坡度 5°，轮半径 0.05 m，滚阻系数 0.02；假设两轮等分牵引力、无滑动。其他轮载和地形冲击未包括。"],["算牵引与轮端","F≈8×0.3+8×9.81×sin5°+0.02×8×9.81×cos5°≈10.80 N；每驱动轮转矩约 0.270 N·m，轮速约 95.5 r/min。"],["折算电机工作点","i=20、η=0.75 时，电机约 1910 r/min、0.0180 N·m；这是该牵引工况的负载折算，未加入电机/传动加速惯量和瞬态余量。检查实际转矩—转速曲线、驱动电压、电流与热。"],["机械接口与抓地","检查驱动轮法向载荷和摩擦上限，轮毂连接、轴承悬臂、减速箱输出载荷，以及安装板和连接器空间。大轮使所需转矩增加，轮速降低，电机工作点同步变化。"],["验证与迭代","做受控载荷、坡度、启动和温升测试，记录速度误差、电流与打滑；按结果调整轮径、减速比、控制或结构。不能仅凭计算宣称整机能爬指定坡。"]],"question":"如果换成两倍半径的轮，哪些量会同时变化？","answer":"同牵引力与车速下，轮端转矩约翻倍，轮速减半。若减速比不变，电机转矩也约翻倍、转速减半；功率量级基本不变但工作点、效率、轮载和重心可能变化。","sources":["T6","N23"]},{"id":"case-joint","title":"机器人肘关节：不是电机加一个壳","tag":"系统接口 · 动力与定位","intro":"教学任务：水平举起带负载的机械臂。关节模组要同时满足承载、精度、散热和控制需求。","visual":"arm","links":["robot-kinematics","loads","servo","bearings","foc","cabling"],"steps":[["负载到转矩","臂自重 2 kg、重心距 0.15 m；末端 1 kg、距 0.3 m。水平静力矩 5.89 N·m，但加速、碰撞和其他姿态仍需分析。"],["传动与轴承分工","减速器负责传动，输出端支撑承受径向、轴向和倾覆力矩；能输出额定转矩并不等于外载轴承也合格。明确由谁承受弯矩。"],["定位误差链","电机编码器、减速器背隙与弹性、轴承间隙、安装面和臂挠度共同影响末端。决定反馈测哪里，再讨论控制补偿和精度指标。"],["热与线束","长时间水平保持会持续发热；关节内走线需要完整运动包络、扭转和服务余量。机壳兼作散热器时，接触与涂层成为热设计的一部分。"],["交付与试验","建立电源、通信、孔位、零位、质量惯量和极限工况接口表。分别验证静态保持、轨迹、温升、重复定位和断电行为。"]],"question":"为什么“电机位置到位”还不能证明末端精度？","answer":"负载端还存在传动误差、结构变形、热漂和装配基准误差。要根据末端功能测量，而不是只读电机编码器。","sources":["N18","N13","T7","T28"]},{"id":"case-bracket","title":"相机支架：从一块平板到可验证的结构","tag":"轻量化 · 材料与制造","intro":"教学任务：端部承受 20 N、长 100 mm 的支架，允许位移 0.2 mm。比较材料与截面，而不是凭外观“加厚”。","visual":"beam","links":["beam","materials-metrics","cnc","sheet","datums","fea"],"steps":[["建立基线","铝、宽 20 mm、厚 5 mm 的理想平板梁：σ约 24 MPa、δ约 0.457 mm。即使屈服强度足够，刚度仍不足。"],["比较三条修改路线","增厚提高 I 但增重；折边或槽形把材料移离中性轴；缩短悬臂在空间允许时很有效。换高强铝可能并不明显改善 E。"],["把工艺引入","小批可比较 CNC 和折弯；CNC 内角受刀具约束，折弯要考虑内 R、回弹和工具。打印可验证接口，但不能直接证明最终金属刚度。"],["把精度引入","相机安装面、定位销与孔位构成基准。支架位移还会引起角度误差；把光轴要求转化成可测机械指标。"],["实物验证","用已知加载、位移测量与重复装拆检查假设；连接柔度可能让实测比理想梁更软，再据此修正模型。"]],"question":"怎样让“优化了”变成证据？","answer":"在相同负载、支撑和测量条件下，记录重量、最大位移/角度、装配时间和版本。说明模型与实物差异，保留未验证工况。","sources":["T1","T16","T22"]},{"id":"case-enclosure","title":"塑料外壳：为什么螺柱裂了，孔还对不上？","tag":"材料 · 注塑 · 公差 · 装配","intro":"教学排故：外壳装配时部分螺柱开裂，两半壳体偶发错位。先建立不同假设，再安排区分测试。","visual":"molding","links":["polymers","injection","bolts","stack","gdt","failure"],"steps":[["记录时间与位置","在拧紧时裂、放置后裂、受冲击后裂对应不同线索。记录批次、螺钉、扭矩、裂纹起点、清洁剂和温湿度。"],["检查材料与成形","核对牌号、干燥/回料条件、熔接线、气孔与柱根厚肉。不要仅凭颜色判定材料。必要时用剖切、显微或合适检验支持假设。"],["检查连接设计","底孔、旋入深度、螺钉类型、锁紧扭矩与柱根结构是否匹配。螺钉先碰底也可能把工件顶裂，换更硬塑料未必有效。"],["检查误差链","确认每半壳的基准、收缩、翘曲、定位止口和螺钉间隙；用尺寸链分辨是设计没有余量还是过程偏移。定位与夹紧不要全部交给间隙螺钉。"],["单因素修正与回归","根据证据改柱、底孔、成形或装配工艺，再复测装配、拉脱、环境和重复拆装；未经试验的改善只是候选方案。"]],"question":"为什么不能直接回答“材料强度不够”？","answer":"相同现象可能来自应力集中、螺钉尺寸、扭矩、成形缺陷、应力开裂或定位错误。需要能区分原因的证据。","sources":["T17","T18","N3","T25"]},{"id":"case-suction","title":"壁面吸附：吸力很大，为什么还是滑？","tag":"受力 · 气动 · 密封","intro":"教学推演，不代表任何现有爬壁机器人已验证。把法向吸附、切向摩擦和倾覆力矩分开。","visual":"pneumatic","links":["grippers","loads","fluid-actuators","seals","test-plan"],"steps":[["先画受力","重力沿墙面向下，压差产生主要法向作用；接触摩擦抗滑，重心离墙会产生倾覆力矩。喷枪反力和移动加速度可能另加负载。"],["算量级而非承载承诺","直径 40 mm、压差 50 kPa 的理想法向力约 62.8 N。这不是实际可悬挂重量，表面、泄漏、有效面积和边缘剥离会降低能力。"],["看气路与密封","泵的极限真空与在泄漏流量下能维持的压差不同。软管、阀、密封唇、壁面孔隙和灰尘都影响工作点，必须测压力随运动的变化。"],["看结构与动作","多吸盘间距、柔顺与腿部动作改变载荷分配。抬起一个吸盘可能使其余吸盘承受更大倾覆力矩，需要分析切换工况。"],["设计验证边界","从受约束的低风险试验平台验证，包含失压检测和承载保护。不能只凭静态一次吸住就做高处行走展示。"]],"question":"真空度达到目标，为什么仍需测承载？","answer":"读数没有完整反映有效接触、摩擦、剥离、动态分配与持续泄漏。目标压力只是多个必要条件之一。","sources":["N16","N17","N24"]},{"id":"case-rover","title":"真实案例：好奇号车轮损伤给设计的提醒","tag":"NASA 公开记录 · 真实照片","intro":"2017 年公开照片记录了好奇号车轮凸起胎纹的断裂。NASA 还进行了地面车轮性能试验，并将使用经验带入后续车轮设计。","visual":"rover","links":["fatigue","buckling","mobility","test-plan","failure"],"steps":[["先看能确认的事实","照片中可见轮面孔洞、撕裂及局部胎纹损伤。出处为 NASA/JPL-Caltech/MSSS 的 PIA21486；不要从一张照片直接推出精确载荷或材料疲劳参数。"],["再看官方如何验证","NASA 的地面试验评估了轮损伤对牵引性能的影响。这里的关键是把失效现象与任务性能联系起来，而不是只问“还能不能转”。"],["连接到设计取舍","更厚、更重、不同胎纹与接触几何都会影响耐久、牵引和质量。后续毅力号车轮设计吸收了前代使用经验；本站不声称重现其全部设计计算。"],["迁移到你的项目","保留失效件、描述工况、设置代表性试验、评估性能下降，再决定结构、控制或运行策略如何修改。这条流程同样适用于小车轮毂、支架和关节线束。"]],"question":"这个案例可以教会我们什么，不能证明什么？","answer":"能说明现场失效、地面测试与后续设计之间的工程闭环。不能仅凭照片确定你的小车也会以相同机制失效，更不能把 NASA 的寿命指标直接套给其他轮子。","sources":["N21","N22","N23"]}],"materials":[{"name":"Q235 类结构钢","family":"钢铁","rho":7.85,"E":206,"use":"焊接底架、钣金支撑","good":"经济、供应广，适合许多焊接与成形应用","risk":"密度高；腐蚀防护、焊接变形与具体等级要查","lesson":"steels","source":"N6"},{"name":"45 钢","family":"钢铁","rho":7.85,"E":206,"use":"轴、销、一般机械件","good":"可通过相应热处理调整性能","risk":"状态影响强度，轴肩和键槽需疲劳校核","lesson":"steels","source":"N6"},{"name":"40Cr","family":"钢铁","rho":7.85,"E":206,"use":"轴、承载传动件","good":"调质后可获得适用的强韧性组合","risk":"不是所有工况都需要；工艺与供货状态须明确","lesson":"steels","source":"N6"},{"name":"304 不锈钢","family":"钢铁","rho":7.9,"E":193,"use":"外罩、支架、清洁环境零件","good":"常见耐蚀材料，成形和连接应用广","risk":"氯环境、缝隙和表面污染仍会带来腐蚀风险","lesson":"steels","source":"N4"},{"name":"316 不锈钢","family":"钢铁","rho":8.0,"E":193,"use":"更苛刻腐蚀环境的候选件","good":"在部分含氯环境可比 304 更有优势","risk":"并非绝不腐蚀；需查具体浓度、温度和状态","lesson":"steels","source":"N5"},{"name":"5052 铝板","family":"有色金属","rho":2.68,"E":70,"use":"折弯外罩、轻质板件","good":"常见钣金候选，兼顾成形和耐蚀","risk":"H/O 等状态及纹向影响折弯，内 R 要按工艺","lesson":"alloys","source":"N6"},{"name":"6061 铝合金","family":"有色金属","rho":2.7,"E":69,"use":"CNC 支架、壳体、结构件","good":"加工、耐蚀与综合性能较均衡","risk":"T6 等状态影响强度；焊后局部可能软化","lesson":"alloys","source":"T3"},{"name":"6063 铝合金","family":"有色金属","rho":2.7,"E":69,"use":"挤压框架、型材、部分散热件","good":"挤压成形与表面处理应用广","risk":"按型材规格与状态核对性能","lesson":"alloys","source":"T3"},{"name":"7075 铝合金","family":"有色金属","rho":2.81,"E":72,"use":"有高强要求的轻质零件","good":"高强度候选","risk":"刚度不比 6061 成倍提高，耐蚀与连接需评估","lesson":"alloys","source":"N6"},{"name":"铜","family":"有色金属","rho":8.9,"E":110,"use":"导电件、导热路径","good":"导电导热性能有优势","risk":"质量和成本高，界面热阻仍可能主导","lesson":"alloys","source":"N6"},{"name":"钛合金（类别）","family":"有色金属","rho":4.5,"E":110,"use":"高比强度与耐蚀需求零件","good":"适合部分严苛需求","risk":"价格、切削、连接和导热有代价，具体牌号差异大","lesson":"alloys","source":"N6"},{"name":"ABS","family":"工程塑料","rho":1.05,"E":2.1,"use":"电子外壳、外观件","good":"成形与表面加工应用广","risk":"耐候、温度、阻燃需看牌号；会蠕变","lesson":"polymers","source":"N3"},{"name":"PC","family":"工程塑料","rho":1.2,"E":2.3,"use":"透明防护罩、抗冲击外壳","good":"透明性与韧性是常见选择理由","risk":"应力开裂、介质与缺口敏感性需查","lesson":"polymers","source":"N3"},{"name":"PA6（未增强、示意干态）","family":"工程塑料","rho":1.14,"E":3.0,"use":"齿轮、滑动与耐磨件","good":"机械与摩擦性能可适用于多种零件","risk":"吸湿使尺寸和性能变化；干态数值不能代替调湿态","lesson":"polymers","source":"N2"},{"name":"POM（未增强）","family":"工程塑料","rho":1.41,"E":2.8,"use":"精密小齿轮、滑块、轴套","good":"滑动、耐磨、低吸湿常是优点","risk":"黏接、蠕变、温度与化学相容性仍需核对","lesson":"polymers","source":"N1"},{"name":"PP","family":"工程塑料","rho":0.9,"E":1.4,"use":"薄壳、活铰链、耐介质容器","good":"低密度，部分牌号适合反复弯曲结构","risk":"刚度、收缩与蠕变可能限制精密承载","lesson":"polymers","source":"N3"},{"name":"PEEK（未增强）","family":"工程塑料","rho":1.3,"E":3.6,"use":"高温、耐化学工况候选件","good":"可面向更苛刻温度和介质条件","risk":"价格和加工成形要求高，仍需具体牌号验证","lesson":"polymers","source":"N3"},{"name":"PTFE","family":"工程塑料","rho":2.16,"E":0.5,"use":"低摩擦、密封与耐介质件","good":"低摩擦和耐化学能力突出","risk":"低刚度、冷流/蠕变与连接问题需注意","lesson":"polymers","source":"N3"},{"name":"硅橡胶（类别）","family":"弹性 / 复材","rho":1.2,"E":null,"use":"密封、柔顺、隔振候选","good":"柔性和适用温度范围依配方而定","risk":"不能只按硬度选；压缩永久变形、介质与撕裂要查","lesson":"composites","source":"N24"},{"name":"碳纤维复合材料","family":"弹性 / 复材","rho":1.6,"E":null,"use":"轻质板、管与特定承载件","good":"可沿设计方向获得较高比刚度","risk":"各向异性、分层、孔边、接头与电偶腐蚀","lesson":"composites","source":"T2"}],"labs":[{"id":"materials","title":"材料选择台","desc":"按场景筛选，比较密度、刚度与代价","lesson":"material-selection"},{"id":"beam","title":"悬臂梁实验","desc":"改变截面，观察重量、应力和挠度","lesson":"beam"},{"id":"gear","title":"齿轮传动","desc":"转速、转矩、方向和效率一起看","lesson":"gears"},{"id":"arm","title":"两连杆机械臂","desc":"拖动关节，探索工作空间与奇异位形","lesson":"robot-kinematics"},{"id":"motor","title":"电机原理切换","desc":"有刷换向、步进励磁与无刷旋转磁场","lesson":"motor-types"},{"id":"pwm","title":"PWM 与负载","desc":"占空比不等于精确转速","lesson":"brushed"},{"id":"pid","title":"PID 调参台","desc":"看超调、稳态偏差、扰动和饱和","lesson":"pid"},{"id":"fit","title":"孔轴公差带","desc":"实时算最小与最大间隙","lesson":"fits"},{"id":"stack","title":"装配尺寸链","desc":"从名义尺寸看到最坏边界","lesson":"stack"},{"id":"position","title":"位置度公差带","desc":"圆形允许范围与 XY 误差的区别","lesson":"gdt"},{"id":"cnc","title":"刀具与内圆角","desc":"刀半径如何约束型腔","lesson":"cnc"},{"id":"bend","title":"钣金展开","desc":"内 R、板厚、K 与弧长","lesson":"sheet"},{"id":"molding","title":"注塑循环","desc":"充填、保压、冷却、开模、顶出","lesson":"injection"},{"id":"bolt","title":"螺栓预紧模型","desc":"外载增加时，夹紧力如何变化","lesson":"bolts"},{"id":"heat","title":"热阻网络","desc":"找出热源到环境的瓶颈","lesson":"thermal"},{"id":"vibration","title":"共振与阻尼","desc":"扫频、改质量、看响应峰","lesson":"vibration"},{"id":"syste iv class="section-head"><h2>三条常见的工程推理链</h2></div><div class="grid three"><div class="card"><div class="card-body"><h3>支架为什么晃？</h3><p>载荷 → 材料 E → 截面 I → 连接柔度 → 模态 → 测量</p><a href="#case/case-bracket">跟着相机支架推演 →</a></div></div><div class="card"><div class="card-body"><h3>为什么转不动？</h3><p>阻力 → 传动 → 电机工作点 → 驱动限流 → 卡滞 / 热</p><a href="#case/case-chassis">跟着小车推演 →</a></div></div><div class="card"><div class="card-body"><h3>为什么装不上？</h3><p>基准 → 尺寸链 → 成形变形 → 测量 → 工艺与版本</p><a href="#case/case-enclosure">跟着外壳排故 →</a></div></div></div>`;}
