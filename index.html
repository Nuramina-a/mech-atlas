function sourcesPage(){const groups=['课程与岗位','面经','教材 / 原厂','真实案例'];return header('RESEARCH & REFERENCES','知识范围从哪里来，结论依据是什么','检索与整理日期：2026-11-12。课程内容为原创教学解释与假设算例，以下资料用于核对原理、术语、工艺条件和案例事实。')+`<div class="hint"><b>覆盖范围：</b>本科机械/机电基础到初级机械设计、结构设计、机器人集成与制造岗位。电磁设计、复杂 CFD、复材层合理论、先进控制和行业认证仅建立入口，没有把本学习站包装成完整专业教材。</div><div class="section-head"><h2>先调查知识范围，再组织课程</h2></div><div class="table-wrap"><table class="material-table"><thead><tr><th>证据层</th><th>提供什么</th><th>怎样使用</th></tr></thead><tbody><tr><td>用户提供的岗位原文</td><td class="wide">结构、制图/BOM、加工、装配验证、协同、标准化</td><td class="wide">作为最初的任务清单；扩展后不限于单一公司</td></tr><tr><td>候选人面经</td><td class="wide">力学、材料、配合、轴承、电机、工艺与项目追问</td><td class="wide">用于发现题型，不用于证明技术答案或统计命中率</td></tr><tr><td>大学课程体系</td><td class="wide">材料与力学、机构、控制、制造、试验</td><td class="wide">补齐零散面经遗漏的知识主干</td></tr><tr><td>原厂与教材</td><td class="wide">参数定义、计算条件、工艺约束、传感与控制原理</td><td class="wide">核对技术解释，保留适用条件</td></tr><tr><td>真实工程案例</td><td class="wide">现场损伤、地面试验、设计改进的关系</td><td class="wide">NASA 案例有公开出处，其余五例明确为教学任务</td></tr></tbody></table></div><div class="hint warning"><b>检索限制：</b>本次可核查的面经以牛客为主。知乎和小红书搜索未获得足够相关、可核查正文，因此没有声称全面覆盖它们。M1–M3 是同一作者在不同公司的经历，不是三个独立候选人样本。海外有经验岗位只作长期能力范围参照，不作为校招必须全部掌握的要求。</div>${groups.map(kind=>`<section><div class="section-head"><h2>${esc(kind)}</h2><small>${Object.values(DATA.sources).filter(s=>s.kind===kind).length} 项</small></div><div class="card">${Object.entries(DATA.sources).filter(([id,s])=>s.kind===kind).map(([id,s])=>`<div class="source-card"><span class="source-id">${id}</span><div><h3><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ↗</a></h3><p>${kind==='面经'?'候选人自述；题意归纳不等于官方考纲。':kind==='真实案例'?'案例事实与图片归属见原始页面。':'资料中的具体数值、默认规则和版本仍需按实际项目查证。'}</p></div></div>`).join('')}</div></section>`).join('')}<div class="section-head"><h2>图像、动画与计算的边界</h2></div><div class="card"><div class="card-body"><p>除 NASA 车轮照片外，图解与动画均为本学习站原创 SVG 教学示意。未把示意云图、转动动画或简化计算当作真实有限元、电磁仿真或实机测试。</p><p>NASA 车轮照片署名 NASA/JPL-Caltech/MSSS，图片编号 PIA21486。图像仅用于说明公开记录的损伤案例，不暗示 NASA 对本学习站背书。</p><p>材料图的模量与密度用于数量级比较；具体牌号、状态、方向、温度与供货标准决定工程数据。计算器结果会随假设改变，不是完整设计审查结论。</p></div></div>`;}
function notFound(){return header('PAGE NOT FOUND','这个入口暂时不存在','请从目录或搜索找到对应知识。')+'<a class="button-link primary" href="#home">回学习首页</a>';}
function render(keepScroll=false){stopLab();document.getElementById('figureDialog').close();const [kind,id,more]=(location.hash.slice(1)||'home').split('/');let html;switch(kind){case'home':html=home();break;case'module':html=modulePage(id);break;case'lesson':html=lessonPage(id);break;case'labs':html=labsPage();break;case'lab':html=labPage(id);break;case'cases':html=casesPage();break;case'case':html=casePage(id);break;case'route':html=routePage(id);break;case'map':html=mapPage(id);break;case'review':html=reviewPage(id||'all',more);break;case'notebook':html=notebookPage();break;case'glossary':html=glossaryPage();break;case'sources':html=sourcesPage();break;default:html=notFound();}
 document.getElementById('main').innerHTML=html;sidebar();document.getElementById('sidebar').classList.remove('open');document.getElementById('backdrop').classList.remove('show');document.body.classList.toggle('night',state.theme==='night');document.body.classList.toggle('large-text',!!state.large);const h1=document.querySelector('main h1');document.title=(h1?.textContent||'学习实验室')+' · 机理';document.getElementById('topTitle').textContent=kind==='lesson'?MM[LM[id]?.module]?.title+' / 学习课程':'机械与机器人 / 学习实验室';if(!keepScroll)window.scrollTo(0,0);initLab();}
const SEARCH_TEXT=DATA.lessons.map(l=>({l,text:[l.title,l.goal,l.formula,l.example,...l.core.map(c=>c.title+' '+c.text),...l.pitfalls].join(' ').toLowerCase()}));
function search(q=''){q=q.trim().toLowerCase();let synonyms={'pwm':'pwm','pid':'pid','foc':'foc','cnc':'cnc','公差带':'公差','材料种类':'材料','电机类型':'电机','控制电机':'控制'},query=synonyms[q]||q;let scored=SEARCH_TEXT.map(({l,text})=>({l,score:!query?1:(l.title.toLowerCase().includes(query)?100:0)+(l.goal.toLowerCase().includes(query)?20:0)+(text.includes(query)?5:0)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,q?16:7);document.getElementById('searchResults').innerHTML=(q?`<div class="small muted" style="padding:3px 15px 8px">${scored.length?'相关课程':'未找到完全匹配，可尝试较短词语：如“电机”“控制”“材料”'}</div>`:'<div class="small muted" style="padding:3px 15px 8px">从一个名词、现象或疑问开始</div>')+scored.map(({l})=>`<a class="search-result" href="#lesson/${l.id}" data-close-search><span class="badge">${esc(MM[l.module].title)}</span><strong style="display:block;margin-top:7px">${esc(l.title)}</strong><p>${esc(l.goal)}</p></a>`).join('')+(q?DATA.cases.filter(c=>(c.title+c.intro+c.steps.flat().join('')).toLowerCase().includes(query)).map(c=>`<a class="search-result" href="#case/${c.id}" data-close-search><span class="badge warm">综合案例</span><strong style="display:block">${esc(c.title)}</strong></a>`).join(''):'');}
document.addEventListener('click',e=>{const scroll=e.target.closest('[data-scroll]');if(scroll){e.preventDefault();document.getElementById(scroll.dataset.scroll)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});return;}if(e.target.closest('[data-close-search]'))document.getElementById('searchDialog').close();const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='search'){search('');let d=document.getElementById('searchDialog');d.showModal();let i=document.getElementById('searchInput');i.value='';i.focus();}else if(a==='close-search')document.getElementById('searchDialog').close();else if(a==='zoom-figure'){const box=b.closest('.lab,.figure-box'),svg=box?.querySelector('svg');if(svg){if(labPlaying)playLab();document.getElementById('zoomCanvas').innerHTML=svg.outerHTML;document.getElementById('figureDialog').showModal();}}else if(a==='close-figure')document.getElementById('figureDialog').close();else if(a==='theme'){state.theme=state.theme==='night'?'day':'night';document.body.classList.toggle('night',state.theme==='night');save();}else if(a==='font'){state.large=!state.large;document.body.classList.toggle('large-text',state.large);save();}else if(a==='focus'){document.body.classList.toggle('focus');b.textContent=document.body.classList.contains('focus')?'退出专注':'专注阅读';}else if(a==='done'){state.done=state.done.includes(id)?state.done.filter(x=>x!==id):[...state.done,id];save();b.classList.toggle('primary',state.done.includes(id));b.textContent=state.done.includes(id)?'✓ 已标记掌握':'○ 标记已掌握';sidebar();toast(state.done.includes(id)?'已记录。试着向别人讲明白这一课。':'已取消掌握标记。');}else if(a==='star'){state.stars=state.stars.includes(id)?state.stars.filter(x=>x!==id):[...state.stars,id];save();b.textContent=state.stars.includes(id)?'★ 已收藏':'☆ 收藏本课';toast(state.stars.includes(id)?'已加入收藏与笔记页。':'已取消收藏。');}else if(a==='to-note')document.getElementById('notes')?.scrollIntoView({behavior:'smooth'});else if(a==='expand'){const ds=[...document.querySelectorAll('.knowledge')],open=ds.some(d=>!d.open);ds.forEach(d=>d.open=open);}else if(a==='play-lab')playLab();else if(a==='reset-lab'){if(!activeLab)return;let aid=activeLab;delete labState[aid];getLabState(aid);labTime=0;labPlaying=false;const old=document.querySelector('.lab');old.outerHTML=labRender(aid);cancelAnimationFrame(raf);initLab();}else if(a==='check-quiz'){let field=b.closest('.quiz'),checked=field.querySelector('input:checked');if(!checked){toast('先选一个答案，再检查。');return;}let choice=Number(checked.value),q=LM[id].quiz,correct=choice===q.answer;state.answers[id]={choice,correct};save();field.querySelector('.quiz-result').innerHTML=`<div class="quiz-feedback ${correct?'':'wrong'}"><b>${correct?'答对了。':'还需要再想一层。'}</b> ${esc(q.why)}<br><span class="small">正确选项：${esc(q.options[q.answer])}</span>${!correct?`<br><a href="#lesson/${id}">回到原理解释 →</a>`:''}</div>`;}else if(a==='material-filter'){document.querySelectorAll('#materialFilter button').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('materialRows').innerHTML=materialRows(b.dataset.family);}else if(a==='export'){let blob=new Blob([JSON.stringify({format:'mech-atlas-learning-v1',exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),x=document.createElement('a');x.href=url;x.download='机理_学习记录_'+new Date().toISOString().slice(0,10)+'.json';x.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('学习记录已导出。');}else if(a==='import')document.getElementById('importFile').click();});
document.addEventListener('input',e=>{if(e.target.id==='explode'){document.getElementById('heroDiagram').innerHTML=V.hero(Number(e.target.value));return;}if(e.target.id==='searchInput'){search(e.target.value);return;}const param=e.target.dataset.param;if(param&&activeLab){getLabState(activeLab)[param]=Number(e.target.value);if(param==='stage'&&labPlaying){playLab();}updateLab();}const note=e.target.dataset.note;if(note&&LM[note]){state.notes[note]=e.target.value;document.getElementById('noteStatus').textContent=save()?'已保存在当前浏览器。':'无法持久保存，请到笔记页导出备份。';}});
document.addEventListener('change',e=>{if(e.target.matches('select[data-param]')&&activeLab){getLabState(activeLab)[e.target.dataset.param]=Number(e.target.value);if(e.target.dataset.param==='stage'&&labPlaying)playLab();updateLab();}});
document.getElementById('importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2*1024*1024)throw Error('文件过大');const incoming=JSON.parse(await file.text());if(incoming.format!=='mech-atlas-learning-v1'||typeof incoming.state!=='object')throw Error('不是机理学习记录文件');const s=incoming.state;state.done=[...new Set([...state.done,...(Array.isArray(s.done)?s.done:[]).filter(id=>LM[id])])];state.stars=[...new Set([...state.stars,...(Array.isArray(s.stars)?s.stars:[]).filter(id=>LM[id])])];if(s.notes&&typeof s.notes==='object')for(const [id,t]of Object.entries(s.notes))if(LM[id]&&typeof t==='string'&&t.length<=100000)state.notes[id]=t;if(s.answers&&typeof s.answers==='object')for(const [id,a]of Object.entries(s.answers))if(LM[id]&&a&&Number.isInteger(a.choice)&&a.choice>=0&&a.choice<LM[id].quiz.options.length)state.answers[id]={choice:a.choice,correct:a.choice===LM[id].quiz.answer};save();render(true);toast('已合并学习记录；同课笔记以导入内容为准。');}catch(err){toast('导入失败：'+err.message);}e.target.value='';});
document.getElementById('menuToggle').addEventListener('click',()=>{document.getElementById('sidebar').classList.toggle('open');document.getElementById('backdrop').classList.toggle('show');});document.getElementById('backdrop').addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('backdrop').classList.remove('show');});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();document.querySelector('[data-action="search"]').click();}});document.getElementById('searchDialog').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close();}});
window.addEventListener('hashchange',()=>render());window.addEventListener('beforeprint',()=>document.querySelectorAll('.knowledge').forEach(d=>d.open=true));render();
</script></body></html>
